<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Readings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--gold:#b8965a;--gold-light:#e8d5a8;--gold-dark:#7a5f2e;--cream:#faf7f0;--cream-dark:#ede6d5;--text:#2c1f0e;--text-mid:#5c4530;--text-soft:#9a7d5e;--bg:#faf7f0;--card:#ffffff;--border:rgba(184,150,90,0.25)}
@media(prefers-color-scheme:dark){:root{--gold:#c9a96e;--gold-light:#e8d5a8;--gold-dark:#c9a96e;--cream:#2a1f10;--cream-dark:#1f1608;--text:#f0e6d0;--text-mid:#c8a97a;--text-soft:#8a6d4a;--bg:#1a1208;--card:#221a0f;--border:rgba(184,150,90,0.2)}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px}
.header{width:100%;text-align:center;padding:16px 12px 12px;border-bottom:1px solid var(--border);background:var(--bg)}
.hstar{display:flex;justify-content:center;margin-bottom:5px}
.header h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(19px,5vw,24px);color:var(--text);letter-spacing:.04em}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:4px;width:100%}
.datebar-greg{font-size:clamp(10px,2.8vw,12px);color:var(--text-soft);font-weight:600;letter-spacing:.04em;font-family:'Jost',sans-serif;text-align:left;flex:1;white-space:nowrap}
.datebar-period{font-size:clamp(10px,2.8vw,12px);color:var(--gold);font-weight:400;letter-spacing:.07em;text-transform:none;font-family:'Jost',sans-serif;text-align:center;flex:0 0 auto;padding:0 6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.datebar-sep{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.datebar-bahai{font-size:clamp(10px,2.8vw,12px);color:var(--text-soft);font-weight:600;letter-spacing:.04em;font-family:'Jost',sans-serif;text-align:right;flex:1;white-space:nowrap}
.content{width:100%;max-width:560px;padding:0 12px}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-top:14px}
.tab{flex:1;text-align:center;padding:10px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;font-family:'Jost',sans-serif;-webkit-tap-highlight-color:transparent}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover:not(.active){color:var(--text-mid)}
#section-reading{padding-top:16px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(18px,5vw,28px) clamp(16px,5vw,24px) 16px;margin-bottom:12px;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-light),var(--gold))}
.porn{text-align:center;font-size:18px;color:var(--gold);margin-bottom:12px;opacity:.7}
.ptxt{font-family:'Cormorant Garamond',serif;font-size:clamp(17px,4.5vw,20px);line-height:1.8;color:var(--text);font-style:italic;text-align:center}
.psrc{margin-top:14px;text-align:right;font-size:12px;color:var(--text-soft);font-weight:300;letter-spacing:.04em;font-family:'Jost',sans-serif}
.psrc em{font-style:italic}
.ptags{display:none}
.tag{display:none}
.actions{display:flex;gap:7px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.abtn{display:flex;align-items:center;gap:5px;padding:9px 13px;border-radius:30px;border:1px solid var(--border);background:var(--card);color:var(--text-mid);font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;min-height:44px}
.abtn:hover{background:var(--cream-dark)}
.abtn:active{transform:scale(.97)}
.abtn svg{width:15px;height:15px;flex-shrink:0}
.abtn.fav-on{background:#fff8e8;border-color:var(--gold);color:var(--gold-dark)}
.abtn.fav-on svg{fill:var(--gold);stroke:var(--gold)}
@media(prefers-color-scheme:dark){.abtn.fav-on{background:#2a2010}}
.abtn.more-on{background:#f0f8ee;border-color:#7ab06a;color:#3a6830}
@media(prefers-color-scheme:dark){.abtn.more-on{background:#0f1f0c;border-color:#4a7040;color:#8ac07a}}
.nextwrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.nxtbtn{background:var(--gold);color:#fff;border:none;border-radius:30px;padding:13px 36px;font-family:'Jost',sans-serif;font-size:15px;letter-spacing:.05em;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;min-height:48px}
.nxtbtn:hover{background:var(--gold-dark)}
.nxtbtn:active{transform:scale(.98)}
.prevbtn{background:none;color:var(--gold);border:1.5px solid var(--gold);border-radius:30px;padding:13px 28px;font-family:'Jost',sans-serif;font-size:15px;letter-spacing:.05em;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;min-height:48px}
.prevbtn:hover:not(:disabled){background:var(--cream-dark)}
.prevbtn:active:not(:disabled){transform:scale(.98)}
.prev-dim{opacity:0.35;cursor:default;border-color:var(--text-soft);color:var(--text-soft)}
.saved-sec{display:none;padding-top:12px}
.saved-sec.vis{display:block}
.saved-list{list-style:none}
.sitem{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:9px;display:flex;gap:9px;align-items:flex-start}
.stext{flex:1;font-family:'Cormorant Garamond',serif;font-size:clamp(14px,4vw,16px);line-height:1.55;font-style:italic;color:var(--text)}
.ssrc{font-size:11px;color:var(--text-soft);margin-top:4px;font-style:normal;font-family:'Jost',sans-serif}
.sdel{background:none;border:none;cursor:pointer;color:var(--text-soft);font-size:20px;padding:4px;line-height:1;flex-shrink:0;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.sdel:hover{color:#c0392b}
.sdel.restore{color:var(--gold)}
.sdel.restore:hover{color:var(--gold-dark)}
.empty{text-align:center;color:var(--text-soft);font-size:14px;padding:28px 0;line-height:1.7}
.egold{color:var(--gold);font-size:20px;display:block;margin-bottom:6px}
.hint{font-size:11px;color:var(--text-soft);margin-bottom:8px;line-height:1.6;font-family:'Jost',sans-serif}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 20px;border-radius:30px;font-size:13px;font-family:'Jost',sans-serif;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;z-index:99;max-width:90vw}
.toast.show{opacity:1}
.verbar{width:100%;text-align:center;padding:16px 12px 20px;margin-top:8px}
.verbar-inner{display:inline-flex;align-items:center;gap:10px}
.vernum{font-size:11px;color:var(--text-soft);font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.05em}
.updbtn{font-size:11px;color:var(--gold);font-family:'Jost',sans-serif;font-weight:400;background:none;border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;letter-spacing:.04em;-webkit-tap-highlight-color:transparent}
.updbtn:hover{background:var(--cream-dark)}
</style>
</head>
<body>
<div class="header">
  <div class="hstar">
    <svg width="46" height="46" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Nine-pointed star" role="img">
      <polygon points="50.000,4.000 57.182,30.266 79.568,14.762 68.187,39.500 95.301,42.012 70.681,53.647 89.837,73.000 63.499,66.087 65.733,93.226 50.000,71.000 34.267,93.226 36.501,66.087 10.163,73.000 29.319,53.647 4.699,42.012 31.813,39.500 20.432,14.762 42.818,30.266" fill="none" stroke="#b8965a" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Daily Readings</h1>
  <p class="sr-only" id="d-sr">Loading</p>
  <div class="datebar" aria-hidden="true">
    <span class="datebar-greg" id="d-greg"></span>
    <span class="datebar-period" id="d-period"></span>
    <span class="datebar-bahai" id="d-bahai"></span>
  </div>
</div>

<div class="content">
  <div class="tabs" role="tablist">
    <div class="tab active" id="t-read" role="tab" tabindex="0" aria-selected="true" onclick="showTab('reading')" onkeydown="if(event.key==='Enter'||event.key===' ')showTab('reading')">Readings</div>
    <div class="tab" id="t-fav" role="tab" tabindex="0" aria-selected="false" onclick="showTab('favourites')" onkeydown="if(event.key==='Enter'||event.key===' ')showTab('favourites')">Favourites</div>
    <div class="tab" id="t-hid" role="tab" tabindex="0" aria-selected="false" onclick="showTab('hidden')" onkeydown="if(event.key==='Enter'||event.key===' ')showTab('hidden')">Hidden</div>
  </div>

  <div id="section-reading">
    <div class="pcard" id="pcard" aria-live="polite" aria-atomic="true">
      <div class="porn" aria-hidden="true">✦</div>
      <p class="ptxt" id="ptxt">Loading...</p>
      <p class="psrc" id="psrc"></p>
      <div class="ptags" id="ptags" aria-hidden="true" style="display:none"></div>
    </div>
    <div class="actions">
      <button class="abtn" id="btn-fav" onclick="toggleFav()" aria-label="Save to favourites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Favourite
      </button>
      <button class="abtn" id="btn-more" onclick="toggleMore()" aria-label="Show more like this">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        More like this
      </button>
      <button class="abtn" id="btn-hide" onclick="hidePassage()" aria-label="Hide this">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        Hide this
      </button>
    </div>
    <div class="nextwrap">
      <button class="prevbtn prev-dim" id="btn-prev" onclick="prevPassage()" aria-label="Previous passage" aria-disabled="true" disabled>‹ Previous</button>
      <button class="nxtbtn" onclick="nextPassage()">Next passage ›</button>
    </div>
  </div>

  <div id="section-favourites" class="saved-sec">
    <ul class="saved-list" id="fav-list"></ul>
  </div>

  <div id="section-hidden" class="saved-sec">
    <p class="hint">Passages you have chosen not to see again. Tap the arrow to restore.</p>
    <ul class="saved-list" id="hid-list"></ul>
  </div>
</div>

<div class="verbar">
  <div class="verbar-inner">
    <span class="vernum" id="vernum" aria-live="polite"></span>
    <button class="updbtn" onclick="updateApp()" aria-label="Update app">Update app</button>
  </div>
</div>
<div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>

<script>
var VERSION = "1.8";
var PASSAGES = [{"id": 1, "text": "If religion is opposed to reason and science, faith is impossible; and when faith and reason are opposed, religion becomes a mere superstition.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["science", "reason", "knowledge"]}, {"id": 2, "text": "Religion and science are the two wings upon which man's intelligence can soar into the heights, with which the human soul can progress. It is not possible to fly with one wing alone!", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["science", "reason", "unity"]}, {"id": 3, "text": "Any religion that contradicts science or that is opposed to it, is only ignorance — for ignorance is the opposite of knowledge.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["science", "reason", "knowledge"]}, {"id": 4, "text": "God has given man the eye of investigation by which he may see and recognise truth. He has endowed man with ears that he may hear the message of reality, and conferred upon him the gift of the investigating mind. Therefore, man must not be an imitator, but must be an investigator of reality.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "reason", "knowledge"]}, {"id": 5, "text": "The first principle of the Bahá'í teaching is the independent investigation of truth, unfettered by superstition or tradition; each individual must follow the light of his own reason and judgment.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "reason", "knowledge"]}, {"id": 6, "text": "It is impossible for religion to be contrary to science, even as it is impossible for the heart to be contrary to the mind. If you examine the matter carefully, you will see that science is reason in action, while religion is the love of God manifested in deeds.", "source": "'Abdu'l-Bahá", "work": "Some Answered Questions", "tags": ["science", "reason", "knowledge"]}, {"id": 7, "text": "Scientific knowledge is the highest attainment upon the human plane, for science is the discoverer of realities.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "knowledge"]}, {"id": 8, "text": "All blessings are divine in origin, but none can be compared with this power of intellectual investigation and research, which is an eternal gift producing fruits of unending delight.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "knowledge", "reason"]}, {"id": 9, "text": "The mind of man is the intermediary between the divine and the human, and is capable of discovering the hidden realities of all things.", "source": "'Abdu'l-Bahá", "work": "Some Answered Questions", "tags": ["science", "reason", "knowledge"]}, {"id": 10, "text": "It is not for him to pride himself who loveth his own country, but rather for him who loveth the whole world. The earth is but one country, and mankind its citizens.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "social", "global"]}, {"id": 11, "text": "The well-being of mankind, its peace and security, are unattainable unless and until its unity is firmly established.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["unity", "peace", "social"]}, {"id": 12, "text": "So powerful is the light of unity that it can illuminate the whole earth.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "social"]}, {"id": 13, "text": "We desire but the good of the world and the happiness of the nations; yet they deem Us a stirrer up of strife and sedition worthy of bondage and banishment.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "peace", "social"]}, {"id": 14, "text": "O ye children of men! The fundamental purpose animating the Faith of God and His Religion is to safeguard the interests and promote the unity of the human race.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["unity", "social", "global"]}, {"id": 15, "text": "The utterance of God is a lamp, whose light is these words: Ye are the fruits of one tree, and the leaves of one branch. Deal ye one with another with the utmost love and harmony.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "love", "social"]}, {"id": 16, "text": "The Great Being, wishing to reveal the prerequisites of the peace and tranquillity of the world and the advancement of its peoples, hath written: The time must come when the imperative necessity for the holding of a vast, an all-embracing assemblage of men will be universally realised.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "global", "social", "governance"]}, {"id": 17, "text": "That which the Lord hath ordained as the sovereign remedy and mightiest instrument for the healing of all the world is the union of all its peoples in one universal Cause, one common Faith.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["unity", "global", "social"]}, {"id": 18, "text": "All men have been created to carry forward an ever-advancing civilisation. The Almighty beareth Me witness: To act like the beasts of the field is unworthy of man.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["civilisation", "social", "action", "progress"]}, {"id": 19, "text": "The world of humanity has two wings — one is women and the other men. Not until both wings are equally developed can the bird fly.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["equality", "social", "women", "progress"]}, {"id": 20, "text": "Women have equal rights with men upon earth; in religion and society they are a very important element. As long as women are prevented from attaining their highest possibilities, so long will men be unable to achieve the greatness which might be theirs.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["equality", "women", "social", "progress"]}, {"id": 21, "text": "In this century in which humanity is making progress in all directions, it is most assuredly necessary for women to advance simultaneously with men.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["equality", "women", "social", "progress"]}, {"id": 22, "text": "The woman is indeed of the greater importance to the race. She has the greater burden and the greater work. Look at the vegetable and the animal kingdoms. The palm tree which gives the most fruit is the female tree.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["equality", "women", "social"]}, {"id": 23, "text": "The time must needs come when the imperative necessity for the holding of a vast, an all-embracing assemblage of men will be universally realised. The rulers and kings of the earth must needs attend it, and, participating in its deliberations, must consider such ways and means as will lay the foundations of the world's Great Peace amongst men.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["peace", "governance", "global", "social"]}, {"id": 24, "text": "Be united, O kings of the earth, for thereby will the tempest of discord be stilled amongst you, and your peoples find rest.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["peace", "governance", "unity", "global"]}, {"id": 25, "text": "Should any king take up arms against another, all should unitedly arise and prevent him. If this be done, the nations of the world will no longer require any armaments, except for the purpose of preserving the security of their realms.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["peace", "governance", "global", "social"]}, {"id": 26, "text": "God maketh no distinction between the white and the black. If the hearts are pure both are acceptable unto Him. God is no respecter of persons on account of either colour or race.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["prejudice", "equality", "social", "race"]}, {"id": 27, "text": "The heaven of divine wisdom is illumined with the two luminaries of consultation and compassion. Take ye counsel together in all matters, inasmuch as consultation is the lamp of guidance which leadeth the way, and is the bestower of understanding.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["consultation", "governance", "social", "practical"]}, {"id": 28, "text": "If a man is not touched by the divine fire of love, he is nothing. May this divine fire burn in you; may it consume all thoughts of race and clan as well as those of country and family.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["prejudice", "love", "social", "equality"]}, {"id": 29, "text": "In the estimation of God all men are equal; there is no distinction or preference for any soul in the dominion of His justice and equity.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["equality", "justice", "social", "prejudice"]}, {"id": 30, "text": "Close your eyes to racial differences and welcome all with the light of oneness. Their hearts will feel your love, and this union will be reflected in the whole world.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["prejudice", "unity", "love", "social"]}, {"id": 31, "text": "O Children of Men! Know ye not why We created you all from the same dust? That no one should exalt himself over the other.", "source": "Bahá'u'lláh", "work": "The Hidden Words", "tags": ["justice", "equality", "social"]}, {"id": 32, "text": "The arrangements of the circumstances of the people must be such that poverty shall disappear, that everyone, as far as possible, according to his rank and position, shall share in comfort and well-being.", "source": "'Abdu'l-Bahá", "work": "Some Answered Questions", "tags": ["economics", "social", "justice", "poverty"]}, {"id": 33, "text": "We see amongst us men who are overburdened with riches on the one hand, and on the other those unfortunate ones who starve with nothing; those who possess several stately palaces, and those who have not where to lay their head.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["economics", "poverty", "justice", "social"]}, {"id": 34, "text": "Wealth is praiseworthy in the highest degree, if it is acquired by an individual's own efforts and the grace of God, in commerce, agriculture, art and industry, and if it be expended for philanthropic purposes.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["economics", "service", "practical", "action"]}, {"id": 35, "text": "O ye rich ones on earth! The poor in your midst are My trust; guard ye My trust, and be not intent only on your own ease.", "source": "Bahá'u'lláh", "work": "The Hidden Words", "tags": ["economics", "poverty", "justice", "service"]}, {"id": 36, "text": "Regard man as a mine rich in gems of inestimable value. Education can, alone, cause it to reveal its treasures, and enable mankind to benefit therefrom.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["education", "knowledge", "social", "progress"]}, {"id": 37, "text": "It is enjoined upon every father and mother to train their children both in good conduct and the study of letters.", "source": "Bahá'u'lláh", "work": "The Kitáb-i-Aqdas", "tags": ["education", "family", "practical", "action"]}, {"id": 38, "text": "Training in morals and good conduct is far more important than book learning. A child that is cleanly, agreeable, of good character, well-behaved — even though he be ignorant — is preferable to a child that is rude, bad-natured, and ill-behaved, even though he be learned.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["education", "character", "practical", "family"]}, {"id": 39, "text": "The education and training of children is among the most meritorious acts of humankind and draweth down the grace and favour of God.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["education", "family", "service", "action"]}, {"id": 40, "text": "Schools must first train the children in the principles of religion, so that the Promise and the Threat recorded in the Books of God may prevent them from the things forbidden and adorn them with the mantle of the commandments; but this in such a measure that it may not injure the children by resulting in ignorant fanaticism.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["education", "knowledge", "reason", "practical"]}, {"id": 41, "text": "It is incumbent upon each one of you to engage in some occupation — such as a craft, a trade or the like. We have exalted your engagement in such work to the rank of worship of the one true God.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["work", "practical", "action", "service"]}, {"id": 42, "text": "The man who makes a piece of notepaper to the best of his ability, conscientiously, concentrating all his forces on perfecting it, is giving praise to God.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["work", "practical", "action", "character"]}, {"id": 43, "text": "Waste not your time in idleness and sloth. Occupy yourselves with that which profiteth yourselves and others.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["work", "action", "practical", "service"]}, {"id": 44, "text": "That one indeed is a man who, today, dedicateth himself to the service of the entire human race.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["service", "action", "social", "work"]}, {"id": 45, "text": "Consultation bestoweth greater awareness and transmuteth conjecture into certitude. It is a shining light which, in a dark world, leadeth the way and guideth.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["consultation", "knowledge", "practical", "governance"]}, {"id": 46, "text": "In all things it is necessary to consult. This matter should be forcibly stressed by thee, so that consultation may be observed by all.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["consultation", "governance", "practical", "action"]}, {"id": 47, "text": "When taking counsel together, every member must be free to express his own opinion and set forth his argument. The shining spark of truth cometh forth only after the clash of differing opinions.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["consultation", "governance", "practical", "social"]}, {"id": 48, "text": "Be generous in prosperity, and thankful in adversity. Be worthy of the trust of thy neighbour, and look upon him with a bright and friendly face.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "practical", "service", "social"]}, {"id": 49, "text": "Be a treasure to the poor, an admonisher to the rich, an answerer of the cry of the needy, a preserver of the sanctity of thy pledge.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["service", "character", "practical", "economics"]}, {"id": 50, "text": "Let your vision be world-embracing, rather than confined to your own self.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "social", "global", "practical"]}, {"id": 51, "text": "Blessed is he who preferreth his brother before himself.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["service", "character", "practical", "love"]}, {"id": 52, "text": "Be an ornament to the countenance of truth, a crown to the brow of fidelity, a pillar of the temple of righteousness, a breath of life to the body of mankind.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["character", "action", "practical", "social"]}, {"id": 53, "text": "Beware lest ye offend the feelings of anyone, or sadden the heart of any person, or move the tongue in reproach of and finding fault with anybody, whether he is friend or stranger, believer or enemy.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["character", "conduct", "practical", "social"]}, {"id": 54, "text": "Associate with all the peoples, kindreds and religions of the world with the utmost truthfulness, uprightness, faithfulness, kindliness, good-will and friendliness.", "source": "'Abdu'l-Bahá", "work": "The Will and Testament of 'Abdu'l-Bahá", "tags": ["conduct", "character", "social", "practical"]}, {"id": 55, "text": "A kindly tongue is the lodestone of the hearts of men. It is the bread of the spirit, it clotheth the words with meaning, it is the fountain of the light of wisdom and understanding.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["communication", "character", "practical", "social"]}, {"id": 56, "text": "In this Day the secrets of the earth are laid bare before the eyes of men. The pages of swiftly-appearing newspapers are indeed the mirror of the world; let that which is mirrored therein be worthy of the sight of God.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["communication", "knowledge", "social", "progress"]}, {"id": 57, "text": "It behoveth the sovereigns of the world — may God assist them — or the ministers of the earth to take counsel together and to adopt one of the existing languages or a new one to be taught to children in schools throughout the world.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["global", "unity", "social", "governance", "language"]}, {"id": 58, "text": "The day is approaching when all the peoples of the world will have adopted one universal language and one common script. When this is achieved, to whatsoever city a man may journey, it shall be as if he were entering his own home.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["global", "unity", "social", "progress", "language"]}, {"id": 59, "text": "Nature in its essence is the embodiment of My Name, the Maker, the Creator. Its manifestations are diversified by varying causes, and in this diversity there are signs for men of discernment.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["nature", "science", "creation", "knowledge"]}, {"id": 60, "text": "The civilisation, so often vaunted by the learned exponents of arts and sciences, will, if allowed to overleap the bounds of moderation, bring great evil upon men.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["civilisation", "moderation", "social", "progress"]}, {"id": 61, "text": "Man is organic with the world. His inner life moulds the environment and is itself also deeply affected by it. The one acts upon the other and every abiding change in the life of man is the result of these mutual reactions.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["nature", "social", "progress", "science"]}, {"id": 62, "text": "Trustworthiness is the greatest portal leading unto the tranquillity and security of the people. In truth the stability of every affair hath depended and doth depend upon it.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "practical", "governance", "social"]}, {"id": 63, "text": "Let integrity and uprightness distinguish all thine acts. Be thou a home for the stranger, a balm to the suffering, a tower of strength for the fugitive.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["character", "practical", "service", "conduct"]}, {"id": 64, "text": "Beware lest ye walk in the ways of them whose words differ from their deeds. Strive that ye may be enabled to manifest to the peoples of the earth the signs of God.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["character", "conduct", "practical", "truth"]}, {"id": 65, "text": "The purpose of justice is the appearance of unity among men.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["justice", "unity", "social", "governance"]}, {"id": 66, "text": "O people of God! That which traineth the world is Justice, for it is upheld by two pillars, reward and punishment. These two pillars are the sources of life to the world.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["justice", "governance", "social", "practical"]}, {"id": 67, "text": "The light of men is Justice. Quench it not with the contrary winds of oppression and tyranny.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["justice", "social", "governance"]}, {"id": 68, "text": "Resort ye, in times of sickness, to competent physicians; We have not set aside the use of material means, rather have We confirmed it through this Pen.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["practical", "science", "knowledge", "action"]}, {"id": 69, "text": "Arts, crafts and sciences uplift the world of being, and are conducive to its exaltation. Knowledge is as wings to man's life, and a ladder for his ascent.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["knowledge", "science", "work", "progress"]}, {"id": 70, "text": "Lay not on any soul a load which ye would not wish to be laid upon you, and desire not for anyone the things ye would not desire for yourselves. This is My best counsel unto you, did ye but observe it.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["practical", "conduct", "social", "character"]}, {"id": 71, "text": "It is incumbent upon every man of insight and understanding to strive to translate that which hath been written into reality and action.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["action", "practical", "knowledge", "progress"]}, {"id": 72, "text": "Let deeds, not words, be your adorning.", "source": "Bahá'u'lláh", "work": "The Hidden Words", "tags": ["action", "practical", "conduct", "character"]}, {"id": 73, "text": "Blessed is he who mingleth with all men in a spirit of utmost kindliness and love.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["social", "conduct", "practical", "love"]}, {"id": 74, "text": "Every day at first light, ye should consider what is to be done, and render thanks unto God for the power given you to be of service to your fellowmen.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["practical", "service", "action", "gratitude"]}, {"id": 75, "text": "Do not busy yourselves in your own concerns; let your thoughts be fixed upon that which will rehabilitate the fortunes of mankind and sanctify the hearts and souls of men.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["service", "social", "action", "detachment"]}, {"id": 76, "text": "So long as one's intention is pure, results will follow. The greater the purity of intention, the greater will be the effectiveness of the action.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["action", "practical", "character", "intention"]}, {"id": 77, "text": "All the arts and sciences can be traced back to the primary impulse of the mind of man and woman which was given to them by God.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "knowledge", "progress", "equality"]}, {"id": 78, "text": "Weigh carefully in the balance of reason and science everything that is presented to you as religion. If it passes this test, then accept it, for it is truth.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["science", "reason", "knowledge", "practical"]}, {"id": 79, "text": "The intellect of man is noble in that it is able to penetrate the mysteries of phenomena. This distinguishing faculty is the glory of man, the difference between him and all other created things.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "reason", "knowledge", "progress"]}, {"id": 80, "text": "Science is the first emanation from God toward man. All created beings embody the potentiality of material perfection, but the power of intellectual investigation and scientific acquisition is a higher virtue specialised to man alone.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "knowledge", "reason", "progress"]}, {"id": 81, "text": "The greatest attainment in the world of humanity has ever been scientific in nature. It is the discovery of reality. The Prophets Themselves were the first teachers of mankind and the fundamentals They established were founded upon science and reason.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "reason", "knowledge", "progress"]}, {"id": 82, "text": "In this day, to act according to the needs of the world and the requirements of its peoples is the greatest of deeds.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["action", "social", "practical", "progress"]}, {"id": 83, "text": "When a thought of war comes, oppose it by a stronger thought of peace. A thought of hatred must be destroyed by a more powerful thought of love.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["peace", "social", "practical", "action"]}, {"id": 84, "text": "The diversity in the human family should be the cause of love and harmony, as it is in music where many different notes blend together in the making of a perfect chord.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["unity", "social", "love", "diversity"]}, {"id": 85, "text": "O ye well-wishers of mankind! The supremacy of man lieth not in his dominion over the earth, the sea and the mountains, but rather in his good character, his high resolve, the breadth of his learning, his exact comprehension of things and his commendable achievements.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "progress", "knowledge", "social"]}, {"id": 86, "text": "The betterment of the world can be accomplished through pure and goodly deeds, through commendable and seemly conduct.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["action", "conduct", "social", "practical"]}, {"id": 87, "text": "The edifice of the world is based upon a spirit of cooperation and reciprocity. If this cooperation be taken away, the world as it is will be abolished and cease to exist.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["unity", "social", "cooperation", "global"]}, {"id": 88, "text": "Until equality is established between men and women in all matters, the world will not progress. The happiness of mankind cannot be achieved so long as half of humanity remains in a condition of subordination.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["equality", "women", "social", "progress"]}, {"id": 89, "text": "Let the loved ones of God, whether young or old, whether male or female, each according to his capabilities, bestir themselves and spare no efforts to acquire the various branches of knowledge.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["education", "knowledge", "equality", "progress"]}, {"id": 90, "text": "In all matters moderation is desirable. If a thing is carried to excess, it will prove a source of evil.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["moderation", "practical", "conduct", "character"]}, {"id": 91, "text": "Tread ye the path of justice, for this, verily, is the straight path. Compose your differences, and reduce your armaments, that the burden of your expenditures may be lightened.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["justice", "peace", "governance", "practical"]}, {"id": 92, "text": "Be fair to yourselves and to others, that the evidences of justice may be revealed, through your deeds, among Our faithful servants.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["justice", "character", "practical", "conduct"]}, {"id": 93, "text": "Material progress and spiritual progress are the two wings of a bird. With one wing alone, flight is impossible.", "source": "'Abdu'l-Bahá", "work": "Some Answered Questions", "tags": ["progress", "science", "social", "civilisation"]}, {"id": 94, "text": "All the human virtues, which are praiseworthy qualities, tend to the improvement of society and the realisation of the happiness of humanity.", "source": "'Abdu'l-Bahá", "work": "Some Answered Questions", "tags": ["character", "social", "progress", "practical"]}, {"id": 95, "text": "These strifes and this bloodshed and discord must cease, and all men be as one kindred and one family. Let the religions agree and make the nations one, so that they may see each other as one family and the whole earth as one home.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["unity", "social", "peace", "diversity"]}, {"id": 96, "text": "The supreme need of humanity is cooperation and reciprocity. The stronger the ties of fellowship and solidarity amongst men, the greater will be the power of constructiveness and accomplishment in all the planes of human activity.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["cooperation", "social", "unity", "progress"]}, {"id": 97, "text": "When perfect equality shall be established between men and women, peace may be realised for the simple reason that womankind in general will never favour warfare.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["equality", "women", "peace", "social"]}, {"id": 98, "text": "If the world be considered with a discerning eye, it will be found that all the capacity and efficiency of the arts and sciences, the expansion of industry and the progress of civilisation are wholly due to the blessings and great bounties of the divine Prophets.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["civilisation", "progress", "science", "knowledge"]}, {"id": 99, "text": "Every nation must have a high intelligence, must have its laws reviewed and revised, and must give its minds to the education of the people, the extension of science, and the service of society.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["governance", "education", "science", "social"]}, {"id": 100, "text": "The happiness and greatness, the rank and station, the pleasure and peace of an individual have never consisted in his personal wealth, but rather in his excellent character, his high resolve, the breadth of his learning, and his ability to solve difficult problems.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["character", "knowledge", "progress", "practical"]}, {"id": 101, "text": "When freedom of conscience, liberty of thought and right of speech prevail — that is to say, when every individual is free to express his own views — then will the world of humanity be elevated to its highest plane of perfection.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["governance", "social", "freedom", "progress"]}, {"id": 102, "text": "True civilisation will unfurl its banner in the midmost heart of the world whenever a certain number of its distinguished and high-minded rulers simultaneously arise, with firm resolve and clear vision, to combat prejudice and passion.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["civilisation", "governance", "progress", "social"]}, {"id": 103, "text": "The benefits of high technology must be shared rather than turned to the service of narrow national interests or commercial greed.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["economics", "social", "global", "progress"]}, {"id": 104, "text": "The emancipation of women, the achievement of full equality between the sexes, is one of the most important, though less acknowledged, prerequisites of peace.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["equality", "women", "peace", "social"]}, {"id": 105, "text": "Among the hallmarks of this new world order will be the abolition of war, the establishment of a world federal system, and the freedom of conscience.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["peace", "governance", "global", "social"]}, {"id": 106, "text": "The source of the problem lies in the absence of a common framework of values and of a common mechanism for the management of human affairs.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["governance", "social", "unity", "global"]}, {"id": 107, "text": "The rich must give of their abundance; they must soften their hearts and cultivate a sense of service, of generosity.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["economics", "service", "social", "character"]}, {"id": 108, "text": "The industrialists and farmers should share in the profits of their labours, and should not suffer poverty, but should be comfortable and happy.", "source": "'Abdu'l-Bahá", "work": "Some Answered Questions", "tags": ["economics", "social", "justice", "practical"]}, {"id": 109, "text": "The gift of God to this enlightened age is the knowledge of the oneness of mankind and of the fundamental oneness of religion.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["knowledge", "unity", "social", "progress"]}, {"id": 110, "text": "We must, in all sincerity, investigate truth ourselves. If we arrive at a conclusion of truth that contradicts the opinion of our fathers and ancestors, we must forsake the old opinion.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["reason", "knowledge", "truth", "practical"]}, {"id": 111, "text": "Truth is one, although its manifestations may be very different. Let the various religions agree on the common foundations and be united in their efforts.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["unity", "truth", "knowledge", "social"]}, {"id": 112, "text": "The time has come when all mankind shall be united, when all races shall be loyal to one fatherland, all religions become one religion, and racial and religious bias pass away.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "global", "social", "peace"]}, {"id": 113, "text": "Enmity and hatred between individuals arise through differences of opinion, lack of sympathy, and narrowness of vision. It is possible to dispel this discord by education, association and training.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["education", "social", "peace", "practical"]}, {"id": 114, "text": "Be ye a refuge to the fearful; bring ye rest and peace to the disturbed; make ye a provision for the destitute; be a treasury of riches for the poor; be a healing medicine for those who are sick.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["service", "social", "practical", "action"]}, {"id": 115, "text": "Divine religion is not a cause for discord and disagreement. If religion becomes the source of antagonism and strife, the absence of religion is preferable.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "social", "reason", "peace"]}, {"id": 116, "text": "Do not be content to sit down and do nothing. Let every one do his share in helping to decrease the suffering of the world.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["service", "action", "social", "practical"]}, {"id": 117, "text": "There are rights and duties enjoined on every man. The duty of every man is the right of his neighbour.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["social", "justice", "practical", "conduct"]}, {"id": 118, "text": "Be kind to all people, love humanity, consider all mankind as your relations and servants of the most high God.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["love", "service", "social", "unity"]}, {"id": 119, "text": "I desire to make clear to you the relation that should exist between faith and works, for faith without deeds is like a beautiful tree without fruit.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["action", "practical", "character", "service"]}, {"id": 120, "text": "The primary difference between the world civilisation of today and that of former ages is that the former was limited and narrow, while today civilisation seeks to embrace all mankind.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["civilisation", "global", "social", "progress"]}, {"id": 121, "text": "Truthfulness is the foundation of all virtues of the world of humanity. Without truthfulness, progress and success, in all the worlds of God, are impossible for any soul.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["character", "truth", "practical", "conduct"]}, {"id": 122, "text": "Beautify your tongues, O people, with truthfulness, and adorn your souls with the ornament of honesty. Beware, O people, that ye deal not treacherously with anyone.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "truth", "practical", "conduct"]}, {"id": 123, "text": "Do not be content with showing friendship in words alone, let your heart burn with loving-kindness for all who may cross your path.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["character", "love", "practical", "service"]}, {"id": 124, "text": "One must see in every human being only that which is worthy of praise. When this is done, one can be a friend to the whole human race.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["character", "social", "practical", "unity"]}, {"id": 125, "text": "Bring thyself to account each day ere thou art summoned to a reckoning; for death, unheralded, shall come upon thee and thou shalt be called to give account for thy deeds.", "source": "Bahá'u'lláh", "work": "The Hidden Words", "tags": ["action", "character", "practical", "conduct"]}, {"id": 126, "text": "Human utterance is an essence which aspireth to exert its influence and needeth moderation. In this matter a middle course is advisable. It behoveth a prudent man of wisdom to speak with utmost leniency and forbearance.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["communication", "character", "practical", "knowledge"]}, {"id": 127, "text": "The structure of world democracy can be built on no other basis than the bedrock of an indestructible, a universal, a transparent and magnanimous love.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["democracy", "governance", "global", "love"]}, {"id": 128, "text": "The task of humanity is to carry forward an ever-advancing civilisation — a task which encompasses material progress as well as spiritual refinement.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["civilisation", "progress", "social", "action"]}, {"id": 129, "text": "Be anxiously concerned with the needs of the age ye live in, and centre your deliberations on its exigencies and requirements.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["social", "action", "practical", "progress"]}, {"id": 130, "text": "No two men can be found who may be said to be outwardly and inwardly united. The evidences of discord and malice are apparent everywhere, though all were made for harmony and union.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["unity", "social", "practical", "progress"]}, {"id": 131, "text": "It is hoped that the hand of divine power may establish the Lesser Peace amongst the people of the world — this peace being the prelude of the Most Great Peace.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["peace", "governance", "global", "social"]}, {"id": 132, "text": "Man must now become imbued with new virtues and powers, new moral standards, new capacities. New bounties, perfect bestowals, are awaiting and already descending upon him.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["progress", "social", "action", "civilisation"]}, {"id": 133, "text": "Today the most urgent need is for unity. The many religious, political, economic and social divisions that beset humanity need to be overcome.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["unity", "social", "global", "peace"]}, {"id": 134, "text": "Every meeting which is organised for the purpose of unity and harmony is good, for it is founded upon the divine intention of love.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["unity", "love", "social", "practical"]}, {"id": 135, "text": "The people must be awakened, illumined and educated so that they may discover the oneness of humanity and recognise all as servants of God.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["education", "unity", "social", "progress"]}, {"id": 136, "text": "Work done in the spirit of service to humanity is the highest form of worship.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["work", "service", "action", "practical"]}, {"id": 137, "text": "Be united in counsel, be one in thought. Let each morn be better than its eve and each morrow richer than its yesterday.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["consultation", "progress", "practical", "action"]}, {"id": 138, "text": "The world is in great turmoil, and the minds of its people are in a state of utter confusion. We entreat the Almighty that He may graciously illuminate them with the glory of His Justice.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["justice", "social", "peace", "governance"]}, {"id": 139, "text": "Ponder the words of God in your hearts, lest through negligence or heedlessness ye turn away from the wellspring of His grace.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["practical", "knowledge", "action", "character"]}, {"id": 140, "text": "My first counsel is this: Possess a pure, kindly and radiant heart, that thine may be a sovereignty ancient, imperishable and everlasting.", "source": "Bahá'u'lláh", "work": "The Hidden Words", "tags": ["character", "love", "practical", "conduct"]}, {"id": 141, "text": "If two nations are at war, ten other nations must arise and mediate between them. International law should bind all the nations together.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["peace", "governance", "global", "social"]}, {"id": 142, "text": "Contention and conflict destroy the very foundation of all human good.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["unity", "social", "peace", "practical"]}, {"id": 143, "text": "We must, in all sincerity, open our eyes and see the world as it is; look at society with clear vision.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["reason", "social", "practical", "knowledge"]}, {"id": 144, "text": "Your thoughts must be lofty, your ideals luminous, your minds spiritual, so that your souls may become a dawning-place for the Sun of Reality.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["character", "knowledge", "practical", "action"]}, {"id": 145, "text": "The civilization of which we dream is one in which science and religion work hand in hand for the betterment of humanity.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["science", "social", "progress", "civilisation"]}, {"id": 146, "text": "Every day at first light, ye should consider what is to be done, and render thanks unto God for the power given you to be of service to your fellowmen.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["practical", "service", "action", "gratitude"]}, {"id": 147, "text": "Let your hearts be pure, your life simple; seek not the pleasures of this world, be not lost in its vain shows. Only through service, love and obedience to the divine will can true happiness be found.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["service", "love", "practical", "character"]}, {"id": 148, "text": "The world is one country and mankind is one people. The era of separatism is over. The call for the unity of the human race is the need of the time.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "global", "social", "progress"]}, {"id": 149, "text": "Bend your minds and wills to the education of the peoples and kindreds of the earth, that haply the dissensions that divide it may, through the power of the Most Great Name, be blotted out from its face.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["education", "unity", "social", "action"]}, {"id": 150, "text": "It is incumbent upon every man, in this Day, to hold fast unto whatsoever will promote the interests, and exalt the station, of all nations and just governments.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["governance", "social", "action", "practical"]}, {"id": 151, "text": "God hath prescribed unto every one the duty of teaching His Cause. Whosoever ariseth to discharge this duty, must needs, ere he proclaimeth His Message, adorn himself with the ornament of an upright and praiseworthy character.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["character", "conduct", "action", "service"]}, {"id": 152, "text": "Racial amity and fellowship is the desire of God. Let those who work for the unity of humanity remember that God maketh no distinction between peoples on account of colour or race.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["prejudice", "equality", "social", "race"]}, {"id": 153, "text": "The secrets of the whole economic question are divine in nature, and are concerned with the world of the heart and spirit. A superficial approach will never solve the problem.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["economics", "social", "justice"]}, {"id": 154, "text": "To give and to be generous are attributes of Mine; well is it with him that adorneth himself with My virtues.", "source": "Bahá'u'lláh", "work": "The Hidden Words", "tags": ["service", "economics", "action", "practical"]}, {"id": 155, "text": "Children must be most carefully watched over, protected and trained; the parents must be ever thoughtful of them, so that they will not fall into evil habits.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["education", "family", "practical", "character"]}, {"id": 156, "text": "The fundamentals of the whole economic condition are divine in nature and are associated with the world of the heart and spirit. If you establish a profit-sharing plan it will have an effect; but profit-sharing is not the fundamental solution.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["economics", "social", "justice"]}, {"id": 157, "text": "Spread not disorder in the land while the people are settling their affairs.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["conduct", "governance", "social", "practical"]}, {"id": 158, "text": "Elevate yourselves above the narrow confines of self, purify your vision, broaden your understanding, and seek to serve the general good.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["service", "social", "practical", "progress"]}, {"id": 159, "text": "Disarmament must be universal and collective, not the unilateral gesture of individual governments.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["peace", "governance", "global"]}, {"id": 160, "text": "Humanity's crying need will not be met by a struggle among competing ambitions or by protest against one or another of the countless wrongs afflicting a desperate age.", "source": "Universal House of Justice", "work": "Letter 2002", "tags": ["social", "action", "service", "progress"]}, {"id": 161, "text": "Human welfare is best served by drawing on the insights of both the female and the male.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["equality", "women", "social", "governance"]}, {"id": 162, "text": "The wise men and the learned among men of goodwill should gather together and with utmost devotion and open-mindedness study their differences and work for unity.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["consultation", "unity", "knowledge", "social"]}, {"id": 163, "text": "No man of wisdom can demonstrate his knowledge save by means of words. This showeth the value of writers in general, and more particularly the value of those who can write well and who have a thorough grasp of the issues, whether they pertain to governance, science, the arts or philosophy.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["knowledge", "communication", "governance", "science"]}, {"id": 164, "text": "Be submissive unto your government and obedient to your king. Strive not against those who are in authority. If they be guided by divine principles, praise God for this great bounty.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["governance", "social", "practical", "conduct"]}, {"id": 165, "text": "A just king is the shadow of God on earth. All should seek shelter under the shadow of his justice.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["justice", "governance", "social", "practical"]}, {"id": 166, "text": "In this day, the one who renders service in any of the productive areas of human activity is performing an act of worship.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["work", "service", "action", "practical"]}, {"id": 167, "text": "The body politic is in need of such a physician who will examine all its organs and members and prescribe a remedy for their healing.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["governance", "social", "science", "progress"]}, {"id": 168, "text": "The purpose of religion is not to dispute but to promote fellowship. The essence of all religions is one.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["unity", "social", "truth", "peace"]}, {"id": 169, "text": "Be ye guided by wisdom in all your doings, and cleave ye tenaciously unto it. Please God that ye may all be strengthened to carry out His commandments, and render Him loyal service.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["character", "practical", "knowledge", "action"]}, {"id": 170, "text": "In your conduct and in your words display the attributes of God. In every action demonstrate the virtues of the world of humanity.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["character", "conduct", "practical", "action"]}, {"id": 171, "text": "When coming together in consultation, the members must turn their faces to the Kingdom on High and ask aid from the Realm of Glory. They must then proceed with the utmost devotion, courtesy, dignity, care and moderation to express their views.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["consultation", "governance", "practical", "prayer"]}, {"id": 172, "text": "Consort with all religions with amity and concord, that they may inhale from you the sweet fragrance of God.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "service", "love"]}, {"id": 173, "text": "It is axiomatic that while you are asleep you cannot hear; if you are deaf, you cannot hear; and if you are blind, you cannot see the sun. Similarly, if the heart is impure, it cannot attain to the mysteries of God.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["knowledge", "character", "reason", "practical"]}, {"id": 174, "text": "The essence of wisdom is the fear of God, the dread of His scourge and the expectation of His justice; for He rewardeth every action with its due, be it good or bad.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["justice", "knowledge", "character", "practical"]}, {"id": 175, "text": "Exert yourselves; the mission before humanity is unspeakably glorious. The essential merit of spiritual life consists in the highest possible standard of conduct toward all men, and in purity and integrity of life.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["action", "service", "progress", "social"]}, {"id": 176, "text": "If the learned and worldly-wise men of this age were to allow mankind to inhale the fragrance of fellowship and love, every understanding heart would apprehend the meaning of true liberation.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["unity", "social", "love", "freedom"]}, {"id": 177, "text": "The wise men and the learned among men of goodwill should gather together and with utmost devotion and open-mindedness study their differences and work for unity.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["consultation", "unity", "knowledge", "social"]}, {"id": 178, "text": "Act in accordance with the counsels of the Lord: that is, rise up in such wise, and with such qualities, as to endow the body of this world with a living soul, and to bring this young child, humanity, to the stage of adulthood.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["action", "progress", "social", "service"]}, {"id": 179, "text": "The light of a good character surpasseth the light of the sun and the radiance thereof.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "conduct", "practical", "social"]}, {"id": 180, "text": "O My servant! Free thyself from the fetters of this world, and loose thy soul from the prison of self. Seize thy chance, for it will come to thee no more.", "source": "Bahá'u'lláh", "work": "The Hidden Words", "tags": ["detachment", "soul", "action"]}, {"id": 181, "text": "It is not possible for man to achieve his highest destiny save through service to others. The more ye serve, the more ye become worthy of the divine Kingdom.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["service", "action", "practical", "social"]}, {"id": 182, "text": "The Bahá'í Faith recognises the unity of God and of His Prophets, upholds the principle of an unfettered search after truth, condemns all forms of superstition and prejudice.", "source": "Shoghi Effendi", "work": "The Faith of Bahá'u'lláh", "tags": ["unity", "reason", "knowledge", "social"]}, {"id": 183, "text": "Waste not your days in idleness and ease. The hand of the craftsman is blessed, the arm of the farmer strong. Those who serve their fellows in any way are among the most beloved of God.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["work", "service", "practical", "action"]}, {"id": 184, "text": "Consider: do all the peoples of the earth need to be brought into one place and united? No, of course not! But they must be united in purpose, in aim and in character.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "social", "practical", "global"]}, {"id": 185, "text": "The cause of world peace is also the cause of the poor; for war is the greatest of all enemies of the welfare of the common people.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["peace", "economics", "social", "poverty"]}, {"id": 186, "text": "Sincerity is the foundation-stone of faith. That is, a religious individual must disregard his personal desires and seek in whatever way he can, wholeheartedly, to serve the public interest.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["character", "service", "practical", "truth"]}, {"id": 187, "text": "The children of men are all brothers. One of the chief prerequisites of brotherhood is that one should wish for one's brother that which one wisheth for oneself. Let none of you pride himself over another.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["unity", "social", "love", "practical"]}, {"id": 188, "text": "Look at the world and ponder a while upon it. It ill beseemeth the proud to vaunt their glory in the realms of the world, inasmuch as within a few days their dominion will pass away.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["social", "detachment", "practical"]}, {"id": 189, "text": "The bedrock of the prosperity of all peoples must needs be the promotion of virtue and the fostering of good character.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "social", "progress", "practical"]}, {"id": 190, "text": "It is the bounden duty of the people of Bahá to be a source of security and comfort to every heart. They must see the world as one country and all humanity as one people.", "source": "Shoghi Effendi", "work": "The Advent of Divine Justice", "tags": ["unity", "social", "service", "global"]}, {"id": 191, "text": "In matters of religion, every opinion is entitled to respect. The seeker after truth is not to be led by the traditions or the institutions of the past, but must search with an open mind.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["reason", "knowledge", "truth", "practical"]}, {"id": 192, "text": "If you have any influence, use it for the spreading of love amongst the people. If you have any wealth, spend it in helping the needy and the sick. If you have any knowledge, teach it to those who are ignorant.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["service", "social", "practical", "education"]}, {"id": 193, "text": "The new age will be an age of science, of justice, of equality. Reason will reign, and knowledge be its throne.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "justice", "progress", "social"]}, {"id": 194, "text": "Beware of prejudice; light is good in whatsoever lamp it is burning! A rose is beautiful in whatsoever garden it may bloom! A star has the same radiance if it shines from the East or from the West.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["prejudice", "unity", "social", "diversity"]}, {"id": 195, "text": "The cause of the disagreement between nations is not religion; religion is really the cause of unity. When the nations forget the divine foundation and follow human imitation, warfare results.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["peace", "unity", "social", "reason"]}, {"id": 196, "text": "The world of creation is dependent upon justice. By justice the world is maintained, by justice the rights of all are preserved.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["justice", "social", "governance", "practical"]}, {"id": 197, "text": "O my God! O my God! Unite the hearts of Thy servants, and reveal to them Thy great purpose. May they follow Thy commandments and abide in Thy law. Help them, O God, in their endeavour, and grant them strength to serve Thee.", "source": "Bahá'u'lláh", "work": "Prayers and Meditations", "tags": ["unity", "social", "action", "service"]}, {"id": 198, "text": "We have made it a duty for every one to seek medical treatment when ill, and to adhere to whatever the physician may prescribe. We have thus made medical science and the art of healing a religious obligation.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["practical", "science", "knowledge", "action"]}, {"id": 199, "text": "Consult experts in every field, and act upon their advice. Those who understand the intricacies of a matter are better placed to counsel on it than those who do not.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["consultation", "knowledge", "practical", "governance"]}, {"id": 200, "text": "The happiness of mankind will be realised when women and men coordinate and advance equally, for each is the complement and helpmeet of the other.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["equality", "women", "social", "progress"]}, {"id": 201, "text": "Every individual, no matter how obscure, or lowly, is in duty bound to choose some profession or trade, and engage in it. This is a matter of divine obligation.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["work", "practical", "action", "social"]}, {"id": 202, "text": "Man must work. The farmer who works in the fields is carrying out a divine obligation. The labourer in the factory is as acceptable to God as the saint in the sanctuary.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["work", "service", "practical", "social"]}, {"id": 203, "text": "O peoples of the world! Forsake all evil, hold fast that which is good. Strive to be shining examples unto all mankind, and true reminders of the virtues of God amidst men.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "conduct", "action", "social"]}, {"id": 204, "text": "The essence of all that We have revealed for thee is Justice, is for man to free himself from idle fancy and imitation, discern with the eye of oneness His glorious handiwork, and look into all things with a searching eye.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["justice", "reason", "knowledge", "practical"]}, {"id": 205, "text": "God has given us reason so that we can investigate truth and recognise what is good and what is harmful. This reason is not to be suppressed; it is to be used.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["reason", "knowledge", "science", "practical"]}, {"id": 206, "text": "Ye are the fruits of one tree, and the leaves of one branch. Deal ye one with another with the utmost love and harmony, with friendliness and fellowship.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "love", "social", "practical"]}, {"id": 207, "text": "Noble have I created thee, yet thou hast abased thyself. Rise then unto that for which thou wast created.", "source": "Bahá'u'lláh", "work": "The Hidden Words", "tags": ["action", "character", "practical", "progress"]}, {"id": 208, "text": "Regard the world as the human body which, though at its creation whole and perfect, hath been afflicted, through various causes, with grave disorders and maladies.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["social", "governance", "progress", "practical"]}, {"id": 209, "text": "Verily I say, this is the Day in which mankind can behold the Face, and hear the Voice, of the Promised One. The Call of God hath been raised, and the light of His countenance hath been lifted up upon men.", "source": "The Báb", "work": "Selections from the Writings of the Báb", "tags": ["covenant", "progress", "social"]}, {"id": 210, "text": "O peoples of the earth! Verily the resplendent Light of God hath appeared in your midst, invested with this unerring Book, that ye may be guided aright to the ways of peace and, by the leave of God, step out of the darkness of ignorance into the effulgent light of understanding.", "source": "The Báb", "work": "Selections from the Writings of the Báb", "tags": ["knowledge", "reason", "progress"]}, {"id": 211, "text": "Be pure, O people of piety, be pure; be righteous, O people of faith, be righteous. Say: O people of God! That which can ensure the victory of Him Who is the Eternal Truth, His hosts and helpers on earth, is the constraining power of wisdom and the actions which are prompted by its promptings.", "source": "The Báb", "work": "Selections from the Writings of the Báb", "tags": ["character", "action", "practical"]}, {"id": 212, "text": "O God, my God! I testify that Thou hast created me to know Thee and to worship Thee. I testify, at this moment, to my powerlessness and to Thy might, to my poverty and to Thy wealth. There is none other God but Thee, the Help in Peril, the Self-Subsisting.", "source": "The Báb", "work": "Bahá'í Prayers", "tags": ["prayer", "knowledge", "character"]}, {"id": 213, "text": "The most acceptable prayer is the one offered with the utmost spirituality and radiance; its prolongation hath not been and is not beloved by God. The more detached and the purer the prayer, the more acceptable is it in the presence of God.", "source": "The Báb", "work": "Selections from the Writings of the Báb", "tags": ["prayer", "practical", "character"]}, {"id": 214, "text": "Verily, the most beloved of all things in My sight is Justice; turn not away therefrom if thou desirest Me, and neglect it not that I may confide in thee. By its aid thou shalt see with thine own eyes and not through the eyes of others, and shalt know of thine own knowledge and not through the knowledge of thy neighbour.", "source": "Bahá'u'lláh", "work": "The Hidden Words", "tags": ["justice", "reason", "knowledge", "practical"]}, {"id": 215, "text": "The essence of all that We have revealed for thee is Justice, is for man to free himself from idle fancy and imitation, discern with the eye of oneness His glorious handiwork, and look into all things with a searching eye.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["justice", "reason", "knowledge", "practical"]}, {"id": 216, "text": "O contending peoples and kindreds of the earth! Set your faces towards unity, and let the radiance of its light shine upon you. Gather ye together, and for the sake of God resolve to root out whatever is the source of contention amongst you.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["unity", "social", "practical", "peace"]}, {"id": 217, "text": "Ye are all leaves of one tree and the fruits of one branch. Deal with one another with the utmost love and harmony, with friendliness and fellowship.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "love", "social", "practical"]}, {"id": 218, "text": "O ye that dwell on earth! The distinguishing feature that marketh the preeminent character of this Supreme Revelation consisteth in that We have, on the one hand, blotted out from the pages of God's holy Book whatsoever hath been the cause of strife, of malice and mischief amongst the children of men.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["unity", "peace", "social", "progress"]}, {"id": 219, "text": "Every age hath its own problem, and every soul its particular aspiration. The remedy the world needeth in its present-day afflictions can never be the same as that which a subsequent age may require.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["progress", "social", "governance", "practical"]}, {"id": 220, "text": "Beware lest the desires of the flesh and of a corrupt inclination provoke divisions among you. Be ye as the fingers o
