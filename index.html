f one hand, the members of one body.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "conduct", "social", "practical"]}, {"id": 221, "text": "They who are possessed of riches must have the utmost regard for the poor, for great is the honour destined by God for the poor who are steadfast in patience.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["economics", "poverty", "justice", "service"]}, {"id": 222, "text": "Man's supreme honour and real happiness lie in self-respect, in high resolves and noble purposes, in integrity and moral quality, in immaculacy of mind.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "conduct", "practical", "progress"]}, {"id": 223, "text": "Speak ye every good word to whomsoever hath come into your presence, and say ye to him things that are pure and true, that the fragrance of the All-Merciful may be shed abroad.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["communication", "conduct", "practical", "character"]}, {"id": 224, "text": "O people of God! I admonish you to observe courtesy, for above all else it is the prince of virtues. Well is it with him who is illumined with the light of courtesy and is attired with the vesture of uprightness.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["conduct", "character", "practical", "social"]}, {"id": 225, "text": "Knowledge is one of the wondrous gifts of God. It is incumbent upon everyone to acquire it. Such arts and material means as are now manifest have been achieved by virtue of His knowledge and wisdom.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["knowledge", "science", "education", "progress"]}, {"id": 226, "text": "Among the greatest of all obligations is the acquisition of arts, crafts and sciences. Knowledge is as wings to man's life, and a ladder for his ascent. Its acquisition is incumbent upon everyone.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["knowledge", "science", "education", "progress"]}, {"id": 227, "text": "We have permitted you to read such sciences as are profitable unto you, not such as end in idle disputation; better is this for you, if ye be of them that comprehend.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["knowledge", "science", "education", "reason"]}, {"id": 228, "text": "Honesty, virtue, wisdom and a saintly character redound to the exaltation of man, while dishonesty, imposture, ignorance and hypocrisy lead to his abasement.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "conduct", "practical", "truth"]}, {"id": 229, "text": "Should any one among you be incapable of grasping a certain truth, or be striving to comprehend it, show forth, when conversing with him, a spirit of extreme kindliness and good-will.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["conduct", "character", "practical", "social"]}, {"id": 230, "text": "Ye are the stars of the heaven of understanding, the breeze that stirreth at the break of day, the soft-flowing waters upon which must depend the very life of all men.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["service", "social", "action", "character"]}, {"id": 231, "text": "O people of Bahá! It is incumbent upon each one of you to engage in some occupation — crafts, trades, and the like. This We have ordained as a token of Our grace unto you.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["work", "practical", "action", "service"]}, {"id": 232, "text": "This is a new cycle of human power. All the horizons of the world are luminous, and the world will become indeed as a garden and a paradise. It is the hour of unity of the sons of men and of the drawing together of all races and all classes.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["unity", "progress", "social", "global"]}, {"id": 233, "text": "If we are true Bahá'ís speech is not needed. Our actions will help on the world, will spread civilisation, will help the progress of science, and cause the arts to develop.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["action", "science", "progress", "civilisation"]}, {"id": 234, "text": "We must not be content with praying and reading the Holy Books. We must put the teachings into practice. Act according to the teachings; live by the teachings.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["action", "practical", "conduct", "character"]}, {"id": 235, "text": "The time has come for humanity to hoist the standard of the oneness of the human world, so that solidarity and unity may bind together all the peoples of the globe.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "global", "social", "progress"]}, {"id": 236, "text": "Among the greatest of all services that can possibly be rendered by man to Almighty God is the education and training of children, young plants of the Abhá Paradise.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["education", "family", "service", "progress"]}, {"id": 237, "text": "Mothers are the first educators of the new generation and their influence reaches to eternity. If the mother is educated, the children will be well educated. When the mother is wise, the children grow up in wisdom.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["education", "women", "equality", "family"]}, {"id": 238, "text": "The children of today are the men and women of tomorrow. They must be trained to be lovers of truth and haters of falsehood; earnest workers in the service of mankind.", "source": "'Abdu'l-Bahá", "work": "Foundations of World Unity", "tags": ["education", "character", "progress", "social"]}, {"id": 239, "text": "A society in which science and religion walk together cannot fail to advance. It will move forward like an army whose soldiers have both weapons and wisdom.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "reason", "progress", "social"]}, {"id": 240, "text": "The body of the human world is sick. Its remedy and healing will be the oneness of the kingdom of humanity. Its life is the Most Great Peace. Its illumination and quickening is love.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "peace", "social", "love"]}, {"id": 241, "text": "The people of the East need to acquire the sciences and technical arts of Europe and America. The people of the West need the spiritual teachings of the East. The two can supplement each other.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "knowledge", "unity", "global"]}, {"id": 242, "text": "All shall be equal before God. There are no distinctions to be made between the rich and the poor, between the learned and the unlearned, between the white and the black, between men and women.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["equality", "justice", "social", "unity"]}, {"id": 243, "text": "See ye no strangers; rather see all men as friends, for love and unity come hard when ye fix your gaze on otherness.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["unity", "love", "social", "prejudice"]}, {"id": 244, "text": "To be a Bahá'í simply means to love all the world; to love humanity and try to serve it; to work for universal peace and universal brotherhood.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["love", "service", "unity", "peace"]}, {"id": 245, "text": "Free yourselves from all kinds of prejudices and superstitions. Know that God is not partial to any people or race.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["prejudice", "equality", "social", "reason"]}, {"id": 246, "text": "The source of courage and power is the promotion and protection of justice.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["justice", "character", "practical", "social"]}, {"id": 247, "text": "Strive that your actions day by day may be beautiful prayers. Turn towards God, and seek always to do that which is right and noble.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["action", "prayer", "practical", "character"]}, {"id": 248, "text": "All humanity is one family. God has created all, and all are His children. He cares for all; none is stranger in His sight.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["unity", "love", "social", "global"]}, {"id": 249, "text": "Gossip is not worthy of a Bahá'í. To talk about the faults of others, even though it may be true, is harmful. It weakens the foundation of society and damages the bonds of love and fellowship.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["conduct", "character", "social", "practical"]}, {"id": 250, "text": "The duty of long years of love and service to humanity is not to speak but to act. Every act, however small, that is done for love and in the love of God and humanity has a far-reaching effect.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["action", "service", "love", "practical"]}, {"id": 251, "text": "Religion must be living, vitally connected with the world of thought, and the minds of its followers must become illumined with its light. It must be constructive, not destructive.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["reason", "knowledge", "progress", "social"]}, {"id": 252, "text": "In this day the one who is honoured in the sight of God is the one who serves most faithfully. Service to humanity is the greatest of all occupations.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["service", "action", "practical", "social"]}, {"id": 253, "text": "The universal disease is the lack of love and absence of true fellowship between men. The divine remedy is the love of God which man must acquire and then reflect to all his fellow beings.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["love", "unity", "social", "practical"]}, {"id": 254, "text": "Woman must endeavour to attain greater perfection, to be man's equal in every respect, to make progress in all in which she has been backward, so that man will be unable to deny her equality of capacity and aptitude.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["equality", "women", "progress", "social"]}, {"id": 255, "text": "A fundamental lack of trustworthiness and honesty is destructive of the foundations of human society, while truthfulness and trust are the supports of civilisation.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["character", "civilisation", "social", "practical"]}, {"id": 256, "text": "If you plant a seed, a tree comes forth. If you deal in love and kindness, love and kindness return to you. This is the fundamental law of social life.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["love", "social", "practical", "action"]}, {"id": 257, "text": "Justice demands that the rights of both men and women be equally respected since both are human beings and both are under the protection of God.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["justice", "equality", "women", "social"]}, {"id": 258, "text": "The greatest gift of God to man is rational intellect, or understanding. Sciences, arts, laws and their application, craftsmanship and all that man's achievements represent are based upon reason.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["reason", "science", "knowledge", "progress"]}, {"id": 259, "text": "Universal education is a necessity. Every child of the human family should receive both moral education and instruction in the arts and sciences — for knowledge is the foundation of all progress.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["education", "knowledge", "progress", "equality"]}, {"id": 260, "text": "The highest form of human knowledge is the knowledge of God and His attributes. But the knowledge of nature, of humanity and of society is equally necessary for human progress.", "source": "'Abdu'l-Bahá", "work": "Some Answered Questions", "tags": ["knowledge", "science", "reason", "progress"]}, {"id": 261, "text": "Let every man examine himself and purify his intentions, then go forth in service. Purity of motive is the key that unlocks the door of true effectiveness.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["action", "service", "character", "practical"]}, {"id": 262, "text": "Is there any greater blessing conceivable for a man, than that he should become the cause of the education, the development, the prosperity and honour of his fellow-creatures?", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["education", "service", "social", "progress"]}, {"id": 263, "text": "There is no greater happiness for man than that of being the cause of advancing the world. This is worship, this is service, this is the highest aspiration of all created beings.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["service", "progress", "action", "social"]}, {"id": 264, "text": "O ye friends of God! Cleanse ye your eyes, so that ye behold no man as different from yourselves. See ye no strangers; rather see all men as friends.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["unity", "love", "prejudice", "social"]}, {"id": 265, "text": "Seek out and call attention to the good in all people, and do not regard their faults. This is the foundation of true love between human beings.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["love", "character", "practical", "social"]}, {"id": 266, "text": "Prejudices of religion, race and nationality are destructive to the foundation of human development. They have stained the pages of history with bloodshed and caused unutterable misery.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["prejudice", "unity", "social", "progress"]}, {"id": 267, "text": "Promote ye the principles of God's teachings. Unsheathe ye the sword of wisdom and of loving words. Counsel ye the people, and enlighten their minds.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["knowledge", "action", "service", "social"]}, {"id": 268, "text": "The friends of God must not be content with existing conditions; they must endeavour with heart and soul to change them. This is true service.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["service", "action", "progress", "social"]}, {"id": 269, "text": "In this age of maturity the peoples of the world must conform their behaviour to the requirements of the age — requirements that are based upon scientific knowledge, universal fellowship and love.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "unity", "love", "progress"]}, {"id": 270, "text": "We must be like the fountain or spring that is continually emptying itself of all that it has and is continually being refilled from an invisible source. To be always giving out for the good of our fellows undeterred by the fear of poverty.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["service", "action", "practical", "character"]}, {"id": 271, "text": "Let your acts be a guide unto all mankind, for the professions of most men, be they high or low, differ from their conduct. It is through your deeds that ye can distinguish yourselves from others.", "source": "'Abdu'l-Bahá", "work": "Gleanings", "tags": ["conduct", "action", "character", "practical"]}, {"id": 272, "text": "Man must walk in many paths and be subjected to various processes in his evolution upward. Physically he is not born in full stature but undergoes a process of growth. Mentally and spiritually also he is born into a world of imperfection, and must work out his destiny.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["progress", "knowledge", "social", "science"]}, {"id": 273, "text": "Bahá'u'lláh says there is a sign from God in every phenomenon: the sign of the intellect is contemplation and the sign of contemplation is silence, because it is impossible for a man to do two things at one time — he cannot both speak and meditate.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["knowledge", "reason", "science", "practical"]}, {"id": 274, "text": "Human brotherhood is founded upon the concept of justice — the recognition that human beings are one family and all entitled to equal consideration.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["justice", "unity", "equality", "social"]}, {"id": 275, "text": "The new age will be an age of science, of justice, of equality. Reason will reign, and knowledge be its throne.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "justice", "progress", "social"]}, {"id": 276, "text": "Beware of prejudice; light is good in whatsoever lamp it is burning! A rose is beautiful in whatsoever garden it may bloom! A star has the same radiance if it shines from the East or from the West.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["prejudice", "unity", "social", "diversity"]}, {"id": 277, "text": "The world of creation is dependent upon justice. By justice the world is maintained, by justice the rights of all are preserved.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["justice", "social", "governance", "practical"]}, {"id": 278, "text": "If you have any influence, use it for the spreading of love amongst the people. If you have any wealth, spend it in helping the needy. If you have any knowledge, teach it to those who are ignorant.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["service", "social", "practical", "education"]}, {"id": 279, "text": "Each of us is responsible for one major area of the world's improvement and regeneration. Let every individual ask himself: what can I do?", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["action", "service", "social", "practical"]}, {"id": 280, "text": "When the love of God is established, everything else will be realised automatically. This is the secret: the love of God is the foundation; everything else is the result.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["love", "unity", "practical", "social"]}, {"id": 281, "text": "Sincerity is the foundation-stone of faith. A religious individual must disregard his personal desires and seek in whatever way he can, wholeheartedly, to serve the public interest.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["character", "service", "practical", "truth"]}, {"id": 282, "text": "The children of men are all brothers, and the mark of true brotherhood is that one should wish for others what one wishes for oneself. Let your fellowship with all people be a testimony to the oneness of humanity.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["unity", "social", "love", "practical"]}, {"id": 283, "text": "The happiness and well-being of humanity can be realised only when the bonds of unity are drawn tighter amongst all peoples, races and nations.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["unity", "social", "global", "peace"]}, {"id": 284, "text": "Ours is the duty to raise the call of the Kingdom and to invite all to accept the oneness of humanity. This is the consummate bounty; this is the eternal glory and everlasting felicity.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "service", "action", "social"]}, {"id": 285, "text": "Education holds the key to progress. A people that is educated will manage its own affairs wisely, will seek peaceable solutions to its problems, and will advance its civilisation rapidly.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["education", "progress", "governance", "social"]}, {"id": 286, "text": "In every age the tendency of society is toward complexity, toward a richer fabric of interdependence. We must see this not as a problem but as the expression of an ever-advancing civilisation.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["progress", "civilisation", "social", "global"]}, {"id": 287, "text": "There is a spirit abroad in the world today which drives men and women to investigate and discover the truth. This spirit is the spirit of the age. It accords with the Bahá'í teaching of independent investigation.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["reason", "science", "knowledge", "progress"]}, {"id": 288, "text": "The bedrock of the prosperity of all peoples must needs be the promotion of virtue and the fostering of good character.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "social", "progress", "practical"]}, {"id": 289, "text": "The Bahá'í Faith recognises the unity of God and of His Prophets, upholds the principle of an unfettered search after truth, condemns all forms of superstition and prejudice, teaches that the fundamental purpose of religion is to promote concord and harmony.", "source": "Shoghi Effendi", "work": "The Faith of Bahá'u'lláh", "tags": ["unity", "reason", "knowledge", "social"]}, {"id": 290, "text": "The principle of the equality of the sexes, the need for compulsory education, and the abolition of the extremes of wealth and poverty: these are among the pivotal elements of the new world order.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["equality", "education", "economics", "social"]}, {"id": 291, "text": "The world is, in truth, moving on towards its destiny. The interdependence of the peoples and nations of the earth, whatever the leaders of the divisive forces of the world may say or do, is already an accomplished fact.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["global", "unity", "progress", "social"]}, {"id": 292, "text": "The time has come when the potential of every human being must be developed, when the equality of women and men must be fully established, and when the resources of the earth must be equitably shared.", "source": "Shoghi Effendi", "work": "The Advent of Divine Justice", "tags": ["equality", "economics", "social", "progress"]}, {"id": 293, "text": "The tabernacle of unity — the oneness of humanity — is the ultimate goal of the Bahá'í Faith. All its teachings, its laws, its institutions are means to this overarching end.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["unity", "global", "social", "governance"]}, {"id": 294, "text": "Science and technology can, if directed by moral purpose and social wisdom, make possible a life of dignity and comfort for every human being on this planet.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["science", "progress", "social", "global"]}, {"id": 295, "text": "Democracy, human rights, and the rule of law are not Western inventions to be imposed on the rest of the world but expressions of the inherent dignity of all human beings.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["democracy", "governance", "justice", "global"]}, {"id": 296, "text": "Women everywhere are demonstrating that they can shoulder any responsibility that any man can shoulder. The removal of obstacles to their full participation is an urgent demand of justice.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["equality", "women", "justice", "social"]}, {"id": 297, "text": "A world at peace is not a utopian dream but a practical necessity if humanity is to survive and flourish in the centuries ahead.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["peace", "global", "social", "progress"]}, {"id": 298, "text": "The fate of humanity in the coming century will be determined by whether people can learn to see themselves as members of one human family — and act accordingly.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["unity", "global", "social", "progress"]}, {"id": 299, "text": "Racism, one of the most baneful and persistent evils, is a major barrier to peace. Its eradication requires changes in attitudes, in institutions, and in laws.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["prejudice", "race", "justice", "social"]}, {"id": 300, "text": "Unfettered by the restrictions that have in the past kept women from full participation in social life, the contribution they will make to civilisation in the coming age will be immeasurable.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["equality", "women", "progress", "civilisation"]}, {"id": 301, "text": "The expansion of communication technologies holds tremendous potential for human development. Information freely shared across borders can lift up the poorest nations alongside the richest.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["science", "progress", "global", "social"]}, {"id": 302, "text": "The most pressing need of the world at this time is a framework of values that all peoples can share — a framework rooted in the recognition of the oneness of humanity.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["unity", "global", "social", "governance"]}, {"id": 303, "text": "A physician without knowledge is like a blind man guiding others. Knowledge without deeds is like a fruitless tree.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["knowledge", "action", "practical", "science"]}, {"id": 304, "text": "The Bahá'í Faith does not advocate a specific economic theory, but insists on certain fundamental principles: the abolition of the extremes of wealth and poverty, and the right of every person to a just share of the world's resources.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["economics", "justice", "social", "global"]}, {"id": 305, "text": "The most vital duty, in this day, is to purify your characters, to correct your manners, and improve your conduct. The beloved of the Merciful must show forth such character and conduct among His creatures that the fragrance of their holiness may be shed upon the whole world.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["action", "service", "love", "practical"]}, {"id": 306, "text": "The Bahá'í state is not a theocracy. It is a system of governance that is fully democratic in character, in which religious and civil authority are kept separate, yet inspired by the same spiritual principles.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["governance", "democracy", "social", "global"]}, {"id": 307, "text": "The world is one country and mankind is one people. The era of separatism is over. The call for the unity of the human race is the need of the time.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "global", "social", "progress"]}, {"id": 308, "text": "O Son of Being! Love Me, that I may love thee. If thou lovest Me not, My love can in no wise reach thee. Know this, O servant.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["service", "progress", "action", "social"]}, {"id": 309, "text": "Work done in the spirit of service to humanity is the highest form of worship.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["work", "service", "action", "practical"]}, {"id": 310, "text": "It is not possible for man to achieve his highest destiny save through service to others. The more ye serve, the more ye become worthy of the divine Kingdom.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["service", "action", "practical", "social"]}, {"id": 311, "text": "The purpose of religion as revealed from the heaven of God's holy Will is to establish unity and concord amongst the peoples of the world; make it not the cause of dissension and strife.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "social", "peace", "practical"]}, {"id": 312, "text": "O ye that dwell on earth! The distinguishing feature that marketh the preeminent character of this new age is that We have blotted out from the pages of God's holy Book whatsoever hath been the cause of strife, of malice and mischief amongst the children of men.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["unity", "peace", "social", "progress"]}, {"id": 313, "text": "The wine of liberty is in the hands of wisdom. Seek it and ye shall obtain it. The candles of truth are lit in the hearts of the pure. Seek them and ye shall find them.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["knowledge", "reason", "truth", "practical"]}, {"id": 314, "text": "Show forbearance and benevolence and love to one another. Should any one among you be incapable of grasping a certain truth, or be striving to comprehend it, show forth patience and forbearance toward him.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["conduct", "character", "social", "practical"]}, {"id": 315, "text": "O ye children of men! The fundamental purpose animating the Faith of God and His Religion is to safeguard the interests and promote the unity of the human race, and to foster the spirit of love and fellowship amongst men.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["unity", "love", "social", "global"]}, {"id": 316, "text": "We can well perceive how the whole human race is encompassed with great, with incalculable afflictions. We see it languishing on its bed of sickness, sore-tried and disillusioned. They that are intoxicated by self-conceit have interposed themselves between it and the Divine and infallible Physician.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["social", "progress", "governance", "practical"]}, {"id": 317, "text": "The Great Being saith: O ye children of men! The fundamental purpose animating the Faith of God is to safeguard the interests and promote the unity of the human race. Regard ye not one another as strangers.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "social", "love", "global"]}, {"id": 318, "text": "One of the signs of the maturity of the world is that no one will accept the claim of anyone to rule over an entire continent. Statesmen will be compelled to take counsel together and to form rules of conduct.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["governance", "global", "progress", "social"]}, {"id": 319, "text": "Blessed is the man who will arise to serve My Cause and who will purify himself from all corrupt desires and will follow the guidance of his Lord.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["service", "character", "action", "conduct"]}, {"id": 320, "text": "The glory of man is his knowledge, his upright conduct, his praiseworthy character, his wisdom and not the gold and silver that he may possess.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["knowledge", "character", "practical", "progress"]}, {"id": 321, "text": "O people of God! That which can ensure the victory of Him Who is the Eternal Truth, His hosts and helpers on earth, is the constraining power of wisdom and of deeds and words that are in conformity with wisdom.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["knowledge", "action", "practical", "character"]}, {"id": 322, "text": "Take heed lest excessive reading and too many acts of piety in the daytime and in the night season make you vainglorious. Should a person arise and, for the sake of God, set himself to reform the world, this would be more meritorious in the sight of God than all else.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["action", "service", "practical", "social"]}, {"id": 323, "text": "Among the things which are conducive to unity and concord and will cause the whole earth to be regarded as one country is that the divers languages be reduced to one language and in like manner the scripts used in the world be reduced to a single script.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["unity", "global", "language", "progress"]}, {"id": 324, "text": "Every word that proceedeth out of the mouth of God is endowed with such potency as can instil new life into every human frame, if ye be of them that comprehend this truth.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["knowledge", "practical", "character", "progress"]}, {"id": 325, "text": "O Son of Being! Walk in My statutes for love of Me, and deny thyself that which thou desirest if thou seekest My pleasure, and spend thine energies for My sake.", "source": "Bahá'u'lláh", "work": "The Hidden Words", "tags": ["service", "action", "character", "conduct"]}, {"id": 326, "text": "The essence of charity is for the servant to recount the blessings of his Lord, and to render thanks unto Him at all times and under all conditions.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["gratitude", "character", "practical", "conduct"]}, {"id": 327, "text": "Hold ye fast unto refinement under all conditions, that your eyes may be preserved from beholding what is repugnant both to your own selves and to the dwellers of Paradise.", "source": "Bahá'u'lláh", "work": "Tablets of Bahá'u'lláh", "tags": ["character", "conduct", "practical", "social"]}, {"id": 328, "text": "He Who is your Lord, the All-Merciful, cherisheth in His heart the desire of beholding the entire human race as one soul and one body. Haste ye to win your share of God's good grace and mercy in this Day.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["unity", "love", "social", "global"]}, {"id": 329, "text": "Every eye, in this Day, should seek what will best promote the Cause of God. He Who is the Eternal Truth knoweth well what woundeth and what healeth.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["action", "knowledge", "practical", "service"]}, {"id": 330, "text": "The virtues and attributes pertaining unto God are all evident and manifest, and have been mentioned and described in all the heavenly Books. Among them are trustworthiness, truthfulness, purity of heart while communing with God, forbearance, resignation, contentment, and generosity.", "source": "Bahá'u'lláh", "work": "Gleanings", "tags": ["character", "conduct", "practical", "knowledge"]}, {"id": 331, "text": "We must now become fully aware of the power of the age in which we live. In past ages, a single individual could accomplish nothing alone. But today the world is more receptive, and a single soul can advance an entire community.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["progress", "action", "social", "civilisation"]}, {"id": 332, "text": "Among the teachings of Bahá'u'lláh is that religious, racial, political, economic and patriotic prejudices destroy the edifice of humanity. As long as these prejudices prevail, the world of humanity will not find rest.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["prejudice", "unity", "social", "progress"]}, {"id": 333, "text": "Science may be likened to a mirror wherein the images of the mysteries of outer phenomena are reflected; divine revelation may be likened to the sun. How far is the reflection from the reality.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "knowledge", "reason", "progress"]}, {"id": 334, "text": "The underlying foundation of the Bahá'í teaching is all-inclusive. It excludes nothing. It is scientific in its method, humanitarian in its ideals, social in its application, spiritual in its essence.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "unity", "social", "progress"]}, {"id": 335, "text": "The world of humanity is not limited to this present life. Beyond this mortal life there is a world of continuance where all the virtues gathered in this world of existence will be preserved and where growth and development will continue.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["progress", "knowledge", "social", "civilisation"]}, {"id": 336, "text": "The east and the west must be united. The north and the south must become one. The races must mingle and associate with each other in order that the differences of colour and degree may be abolished.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "global", "prejudice", "social"]}, {"id": 337, "text": "Everything of importance in this world demands the close attention and cooperation of many people. New ideas can only reach perfection through consultation.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["consultation", "knowledge", "practical", "social"]}, {"id": 338, "text": "We are living in a day of service. All must become servants of the general good. No one should be idle. Every soul must engage in some work, some art, some trade, some occupation.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["work", "service", "action", "practical"]}, {"id": 339, "text": "Real love is impossible unless one turn his face towards God and be attracted to His Beauty. Love in the human world is not real love; it passes away. But divine love does not change.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["love", "social", "character", "practical"]}, {"id": 340, "text": "The happiness of man is in the fragrance of the love of God. The divine love is conferred upon the hearts by the beauty of the love of God. This love is the foundation; without it true happiness is impossible.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["love", "social", "character", "practical"]}, {"id": 341, "text": "How many holy souls have sacrificed their lives upon the altar of humanity in order to kindle this light of brotherhood and love in the hearts of the children of men.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["unity", "love", "social", "service"]}, {"id": 342, "text": "Justice is not limited; it is a universal quality. Its operation must be carried out in all classes, from the highest to the lowest. Justice must be sacred, and the rights of all the people must be considered.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["justice", "social", "equality", "governance"]}, {"id": 343, "text": "All the divisions in the world — hatred, war, butchery — are due to one or other of these prejudices. The only remedy is through the power of the spirit and the spreading of divine love.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["prejudice", "unity", "love", "social"]}, {"id": 344, "text": "We must free ourselves from the mask of self and see our true face in the mirror of our deeds, and ask the question: are we living in accordance with the will of God, or are we not?", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["action", "conduct", "character", "practical"]}, {"id": 345, "text": "Human beings have developed agriculture, extended commerce, founded cities and initiated much that tends to the comfort and convenience of mankind. All these activities were a result of reason and intellect.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["reason", "science", "progress", "civilisation"]}, {"id": 346, "text": "Wealth is most commendable, provided the entire population is wealthy. If, however, a few have inordinate riches while the rest are impoverished and in want, this is but injustice and inequality.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["economics", "justice", "social", "poverty"]}, {"id": 347, "text": "Be a lamp of guidance and do not become a hindrance. Be a fruitful tree and not a barren one. Be a comfort and not a cause of sorrow. Be a source of tranquillity and not a cause of unrest.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["service", "character", "conduct", "practical"]}, {"id": 348, "text": "Extend your love to all people. Do not be content with your own well-being while others suffer. Never think of your own comfort and pleasure before the welfare of those around you.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["love", "service", "social", "practical"]}, {"id": 349, "text": "This is the age of science and the discovery of truth among the children of men. Sciences of former ages and philosophies of the past are useless today. Present exigencies demand new methods of solution.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "progress", "reason", "knowledge"]}, {"id": 350, "text": "The basis of a productive life is the development of virtues and the acquisition of knowledge. All the sciences, arts, and crafts of the world are the means of achieving this productive life.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["knowledge", "science", "education", "progress"]}, {"id": 351, "text": "Look at the world today: everywhere we see nations that are divided from each other by imaginary lines. These lines do not exist in the sight of God. In the sight of God all people are one.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "global", "prejudice", "social"]}, {"id": 352, "text": "For a helpless person, a little bread is better than a great deal. For a man who is ill, health is better than wealth. For the thirsty, water is better than fine food. For the poor, a small portion shared with love is more welcome than a great estate.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["economics", "love", "service", "practical"]}, {"id": 353, "text": "The light of divine bounty shall be shed on all and the darkness of enmity and hatred will be dispelled forever. Universal peace shall be established among all the nations and all the peoples and the world shall be transformed into the supreme paradise.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["peace", "unity", "global", "progress"]}, {"id": 354, "text": "Man is distinguished from the animal by his reason. The more a man's reason is strengthened, the more will he come to understand the divine purpose, and the more will he be at one with his Creator.", "source": "'Abdu'l-Bahá", "work": "Some Answered Questions", "tags": ["reason", "science", "knowledge", "progress"]}, {"id": 355, "text": "Every soul who acquires virtue in this world will achieve greater progress after death. The soul that is separated from the body at a time when it has developed all its virtues will continue to progress to eternity.", "source": "'Abdu'l-Bahá", "work": "Some Answered Questions", "tags": ["progress", "character", "knowledge", "conduct"]}, {"id": 356, "text": "Let nothing discourage you. If all the doors seem closed to you, know that God will open a way. Where there is a sincere endeavour, there is always a path forward.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["action", "patience", "practical", "character"]}, {"id": 357, "text": "The time will come when war and conflict will be impossible because the whole world will be more just, more civilised. Military forces will be unnecessary. Nations will arbitrate their differences.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["peace", "governance", "global", "progress"]}, {"id": 358, "text": "A home without love is no home at all; it is just bricks and mortar. Love is the spirit that animates the home. Without it, no real home exists.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["love", "family", "social", "practical"]}, {"id": 359, "text": "The universal benefits derived from the machine will be immeasurable when man masters it. The use of the machine has not yet been perfected, but in the future it will be used to lessen human toil and to increase the general welfare.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "progress", "economics", "social"]}, {"id": 360, "text": "Let your ambition be the achievement on earth of a heavenly civilisation. In every country or government where Bahá'ís reside, they must behave towards the government with honesty, faithfulness and integrity.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["civilisation", "governance", "conduct", "social"]}, {"id": 361, "text": "Real sociability means that you show your kindness and good-will to all people. If a man be just, kind, humble and sincere, he thereby reflects the attributes of God.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["social", "character", "conduct", "practical"]}, {"id": 362, "text": "The tongue is a smouldering fire, and excess of speech a deadly poison. Material fire consumeth the body, whereas the fire of the tongue devoureth both heart and soul. The force of the former lasteth but for a time, whilst the effects of the latter endure a century.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["communication", "conduct", "character", "practical"]}, {"id": 363, "text": "In every dispensation there hath been the commandment of fellowship and love, but it was a commandment limited to the community of those in agreement, not to all humanity. In this wondrous dispensation the commandment extends to all humanity.", "source": "'Abdu'l-Bahá", "work": "Selections from the Writings of 'Abdu'l-Bahá", "tags": ["love", "unity", "social", "progress"]}, {"id": 364, "text": "Whensoever ye behold a person whose entire attention is directed toward the Cause of God — whose only aim is this — know that his deeds will exert influence. In every age the influence of one soul has been able to permeate the world.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["action", "service", "social", "progress"]}, {"id": 365, "text": "The continent of Europe is submerged in a sea of materialism. Its people are not in touch with God. They are not aware that their own inner powers are divine. They are not conscious that the source of all life and progress is the spirit.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["progress", "social", "civilisation", "reason"]}, {"id": 366, "text": "The foundation of the Bahá'í Faith is the investigation of reality. In all things it is necessary for man to investigate reality. The imitation of ancestral belief, of tradition, of ancient custom, is the cause of much error.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["reason", "knowledge", "science", "practical"]}, {"id": 367, "text": "O ye children of men! Each one of you is a mirror reflecting the light of the sun according to its capacity. The light is always one. But the capacities of the mirrors differ.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "diversity", "knowledge", "social"]}, {"id": 368, "text": "The primary purpose of education is to enable the student to become self-sustaining, to contribute to his own welfare and to the welfare of society, and to serve his country and his people.", "source": "'Abdu'l-Bahá", "work": "The Secret of Divine Civilisation", "tags": ["education", "service", "social", "progress"]}, {"id": 369, "text": "In the Bahá'í Faith, religion is not separate from science. On the contrary, each is the complement of the other. They work together for the betterment of the world.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["science", "reason", "progress", "social"]}, {"id": 370, "text": "Poverty is humiliating. It is a social problem that must be solved. No one should be hungry, no one should be cold, no one should be without shelter. These are basic human rights.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["poverty", "economics", "justice", "social"]}, {"id": 371, "text": "Fellowship, love, brotherhood — these Bahá'u'lláh has proclaimed for all humanity, not for one nation, not for one people, not for a particular religion, but for all humanity.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "love", "global", "social"]}, {"id": 372, "text": "The body of man is in need of physical health, but the spirit of man needs the aliment of light. For the light of the spirit is love. Without it the spirit is like a body without a soul.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["love", "social", "character", "practical"]}, {"id": 373, "text": "This century is the century of the maturity of the human race. In it the world of humanity is being called upon to widen the horizon of its outlook, to realise that all men are the waves of one sea.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["unity", "global", "progress", "social"]}, {"id": 374, "text": "If we are sincere, if we are seekers of truth, if our hearts are free from prejudice and self-interest, we will find the path of truth without difficulty.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["truth", "reason", "knowledge", "practical"]}, {"id": 375, "text": "The world today is sick. Envy, greed, hatred and mistrust are its chief diseases. The only physician who can heal it is divine love, administered through justice.", "source": "'Abdu'l-Bahá", "work": "Paris Talks", "tags": ["love", "justice", "social", "progress"]}, {"id": 376, "text": "We must free ourselves from superstitions and fanaticism. We must investigate reality with the instrument of reason and then have full confidence in the results of that investigation.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["reason", "science", "knowledge", "practical"]}, {"id": 377, "text": "There is an urgency in the present situation. Humanity has reached a great turning-point. The world must either leap forward into a new age of peace and brotherhood or sink backwards into chaos.", "source": "'Abdu'l-Bahá", "work": "The Promulgation of Universal Peace", "tags": ["peace", "social", "global", "progress"]}, {"id": 378, "text": "O peoples of the earth! Verily the Light of God hath appeared in your midst. Fear ye God and follow not the promptings of your own desires. Rather follow the guidance of God and walk in the paths of justice and truth.", "source": "The Báb", "work": "Selections from the Writings of the Báb", "tags": ["justice", "truth", "conduct", "practical"]}, {"id": 379, "text": "The source of all good is trust in God, submission unto His command, and contentment with His holy will and pleasure. The source of all evil is to turn away from God and to follow the promptings of the self.", "source": "The Báb", "work": "Selections from the Writings of the Báb", "tags": ["character", "conduct", "practical", "truth"]}, {"id": 380, "text": "Verily I say, this is the Day in which mankind can behold the Face, and hear the Voice, of the Promised One. The Call of God hath been raised, and the light of His countenance hath been lifted up upon men. It behoveth every man to blot out the trace of every idle word from the tablet of his heart.", "source": "The Báb", "work": "Selections from the Writings of the Báb", "tags": ["conduct", "character", "progress", "practical"]}, {"id": 381, "text": "Be generous in times of prosperity and steadfast in times of trial. Be patient under all conditions and place your trust in God. Know that within every difficulty there is facility, and within every ease there may be hardship.", "source": "The Báb", "work": "Selections from the Writings of the Báb", "tags": ["patience", "character", "practical", "conduct"]}, {"id": 382, "text": "The principle of the oneness of mankind — the pivot round which all the teachings of Bahá'u'lláh revolve — is no mere outburst of ignorant emotionalism or an expression of vague and pious hope. Its appeal is not to be merely identified with a reawakening of the spirit of brotherhood and goodwill among men.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["unity", "social", "global", "progress"]}, {"id": 383, "text": "Humanity, whether viewed in the light of man's scientific achievements or in the light of the spiritual forces released by a succession of divine Revelations, stands, indeed, at the threshold of its coming of age.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["progress", "science", "civilisation", "global"]}, {"id": 384, "text": "The diversity of religious doctrines and dogmas is in no wise acceptable to God; the one standard which He hath laid down is the standard of justice and truth.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["justice", "truth", "unity", "reason"]}, {"id": 385, "text": "It is toward this goal — the building of a new World Order, Divine in origin, all-embracing in scope, equitable in principle, challenging in its features — that the community of Bahá'u'lláh is consciously labouring.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["governance", "global", "unity", "progress"]}, {"id": 386, "text": "Let there be no mistake. The Bahá'í Faith is not a compromise between religions. It is a new religion for a new age, drawing from all of the past but transcending each of them.", "source": "Shoghi Effendi", "work": "The World Order of Bahá'u'lláh", "tags": ["progress", "unity", "knowledge", "social"]}, {"id": 387, "text": "The principle of collective security is already recognised by the community of nations. What remains is the will to put it effectively into operation — a will that requires a new moral commitment on the part of all peoples and their governments.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["peace", "governance", "global", "social"]}, {"id": 388, "text": "It is time that all peoples of the world, irrespective of national, ethnic or religious background, recognise that the well-being of mankind is best served by cooperation rather than competition.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["unity", "cooperation", "global", "social"]}, {"id": 389, "text": "The principle of the oneness of humankind, as proclaimed by Bahá'u'lláh, calls for no less than the reconstruction and the demilitarisation of the whole civilised world.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["unity", "peace", "global", "governance"]}, {"id": 390, "text": "Religion, if it is to lead to human progress, must conform to science and reason, and must reject all that is contrary to knowledge. Any so-called religious teaching that contradicts fact and science is superstition.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["science", "reason", "knowledge", "progress"]}, {"id": 391, "text": "The economic health of the planet requires that the gap between the rich and the poor be progressively reduced. This is not charity; it is justice, and it is a prerequisite for world peace.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["economics", "justice", "poverty", "global"]}, {"id": 392, "text": "A global consciousness is emerging. People everywhere are beginning to see themselves not merely as members of a nation or a religion but as citizens of one world. This shift in consciousness is one of the great developments of our age.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["unity", "global", "progress", "social"]}, {"id": 393, "text": "The long-term solution to the problem of violence lies in the reconstruction of human society on the basis of justice, of love, and of the recognition of the oneness of all people.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["justice", "love", "unity", "social"]}, {"id": 394, "text": "The education of women is of greater importance than the education of men, for women are the first educators of the rising generation. Any deficiency in their education retards the progress of the whole of humanity.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["education", "women", "equality", "progress"]}, {"id": 395, "text": "Material civilisation has brought great benefits, but it has also brought great dangers. Without spiritual values to guide it, material progress can lead to destruction as surely as it can lead to well-being.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["progress", "civilisation", "social", "science"]}, {"id": 396, "text": "In this age of transition, humanity needs a moral and spiritual framework within which its social, economic and political life can be organised. The Bahá'í teachings offer such a framework.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["governance", "social", "progress", "global"]}, {"id": 397, "text": "The independent investigation of truth requires that all prejudice be abandoned and that the mind be kept free and open to receive evidence wherever it may be found.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["reason", "knowledge", "truth", "science"]}, {"id": 398, "text": "The principle of non-interference in politics does not mean indifference to the fate of humanity. On the contrary, Bahá'ís are deeply concerned with the well-being of all peoples and work toward social improvement through constructive means.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["governance", "social", "service", "action"]}, {"id": 399, "text": "The diversity of humankind is not a problem to be overcome but a treasure to be cherished. Each culture, each tradition, each way of understanding the world has something unique to contribute to the whole.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["diversity", "unity", "global", "social"]}, {"id": 400, "text": "Climate change, environmental degradation, and the depletion of natural resources are challenges that no single nation can address alone. They require a level of international cooperation that has not yet been achieved but is urgently needed.", "source": "Universal House of Justice", "work": "Letter to the Peoples of the World 2017", "tags": ["global", "science", "governance", "social"]}, {"id": 401, "text": "The capacity to build a better world lies within each human being. It is not reserved for leaders or experts. Every individual who acts with justice, honesty and love is contributing to the transformation of civilisation.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["action", "service", "character", "progress"]}, {"id": 402, "text": "True prosperity is not merely the accumulation of material goods but the achievement of a life of meaning, purpose and contribution to the well-being of others.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["economics", "service", "practical", "progress"]}, {"id": 403, "text": "The forces driving humanity toward unity are more powerful than the forces driving it toward division, though the latter make more noise. History is on the side of those who work for the good of all.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["unity", "progress", "global", "social"]}, {"id": 404, "text": "Consultation is the operating expression of justice in human affairs. It enables those involved in any enterprise to benefit from the widest possible range of knowledge and understanding.", "source": "Universal House of Justice", "work": "Individual Rights and Freedoms", "tags": ["consultation", "justice", "governance", "practical"]}, {"id": 405, "text": "The integration of spiritual principle with social action is not an ideal for a distant future — it is the work of today. The world cannot wait.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["action", "service", "social", "progress"]}, {"id": 406, "text": "Governance in the modern world must draw upon the intelligence and experience of all sectors of society — not only those in positions of power but the full breadth of humanity's knowledge and creativity.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["governance", "democracy", "global", "social"]}, {"id": 407, "text": "Every Bahá'í community is a demonstration that people of diverse backgrounds, races, cultures and classes can live together in harmony, serving the common good and enriching one another.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["unity", "diversity", "social", "service"]}, {"id": 408, "text": "The Bahá'í writings address some of the most urgent questions of modern life: how to build just societies, how to eliminate poverty, how to achieve equality between women and men, and how to establish lasting peace.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["justice", "equality", "peace", "social"]}, {"id": 409, "text": "Humanity has paid an enormous price for its failure to recognise the oneness of the human family. Wars, exploitation and oppression have been the fruit of division. The path forward is unity.", "source": "Universal House of Justice", "work": "The Promise of World Peace", "tags": ["unity", "peace", "global", "social"]}, {"id": 410, "text": "The advancement of technology must be matched by an advancement in moral consciousness. Otherwise, increased power without increased wisdom only multiplies the capacity for harm.", "source": "Universal House of Justice", "work": "Century of Light", "tags": ["science", "progress", "social", "governance"]}];

// ── BAHÁ'Í CALENDAR ────────────────────────────────────────────────────────
// Bahá'í month names (19 months of 19 days + Ayyám-i-Há)
var BAHAI_MONTHS = [
  "Bahá","Jalál","Jamál","ʻAẓamat","Núr","Raḥmat",
  "Kalimát","Kamál","Asmáʼ","ʻIzzat",
  "Mashíyyat","ʻIlm","Qudrat","Qawl","Masáʼil",
  "Sharaf","Sulṭán","Mulk","Alá"
];
// Naw-Rúz (Bahá'í New Year) falls on 20 March in most years
// Ayyám-i-Há begins after day 19 of Mulk (month 18), before Alá (month 19)
// Mulk day 19 = Gregorian 28 Feb (or 29 Feb in leap year) at noon for simplicity
// We work purely with Gregorian dates for the conversion

// Bahá'í year 1 = 1844 CE. Naw-Rúz = 20 March each year (post-2015 exact astronomical,
// but 20 March is correct for nearly all years and sufficient for display purposes).
// Each Bahá'í day begins at sunset.

// Given a JS Date object, return {month, day, year, isAyyam}
// month = 1-19, day = 1-19, isAyyam = bool (during Ayyám-i-Há)
function toBahaiDate(jsDate) {
  // Work in local date
  var y = jsDate.getFullYear();
  var mo = jsDate.getMonth() + 1; // 1-12
  var d = jsDate.getDate();

  // Naw-Rúz for this Gregorian year is 20 March
  // Bahá'í year = Gregorian year - 1843 (if on/after Naw-Rúz), else - 1844
  var nawRuzMonth = 3, nawRuzDay = 20;

  // Is current date before or after Naw-Rúz?
  var afterNawRuz = (mo > nawRuzMonth) || (mo === nawRuzMonth && d >= nawRuzDay);
  var bahaiYear = afterNawRuz ? (y - 1843) : (y - 1844);

  // Day of Bahá'í year (1 = Naw-Rúz = 20 March)
  // Build a simple day-of-year offset from Naw-Rúz
  // Days in each month for day-of-year calculation
  function isLeap(yr) { return (yr%4===0 && yr%100!==0) || yr%400===0; }
  var daysInMonth = [0,31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31];

  // Day of year for current date (1 = Jan 1)
  var doy = 0;
  for (var i=1;i<mo;i++) doy += daysInMonth[i];
  doy += d;

  // Day of year for Naw-Rúz (20 March)
  var nawRuzDoy = 31 + daysInMonth[2] + 20; // Jan + Feb + 20

  var bahaiDoy; // day within Bahá'í year, 1-indexed from Naw-Rúz
  if (afterNawRuz) {
    bahaiDoy = doy - nawRuzDoy + 1;
  } else {
    // Before Naw-Rúz: count from Naw-Rúz of previous year
    var prevYear = y - 1;
    var daysInPrevFeb = isLeap(prevYear) ? 29 : 28;
    var prevNawRuzDoy = 31 + daysInPrevFeb + 20;
    var prevYearDays = isLeap(prevYear) ? 366 : 365;
    // Days from Naw-Rúz of prev year to end of prev year
    var daysAfterPrevNawRuz = prevYearDays - prevNawRuzDoy + 1;
    bahaiDoy = daysAfterPrevNawRuz + doy;
  }

  // Bahá'í year has 365 (or 366) days: 19*19 = 361 + 4 (or 5) Ayyám-i-Há days
  // Months 1-18 = days 1-342, Ayyám-i-Há = days 343-346 (347 in leap), month 19 = remaining 19 days
  var leapBahai = isLeap(afterNawRuz ? y : y-1); // leap year of the Gregorian year containing Naw-Rúz
  // Actually Ayyám-i-Há length = 4 normally, 5 in leap year preceding Naw-Rúz
  // The leap that matters is the Gregorian year in which Naw-Rúz falls (i.e. current if after NR, prev if before)
  var nawRuzYear = afterNawRuz ? y : y - 1;
  // Ayyám-i-Há has 5 days if the NEXT Gregorian year is a leap year (the year after Naw-Rúz)
  var ayyamLength = isLeap(nawRuzYear + 1) ? 5 : 4;

  if (bahaiDoy <= 342) {
    var month = Math.ceil(bahaiDoy / 19);
    var day = bahaiDoy - (month - 1) * 19;
    return {year: bahaiYear, month: month, day: day, isAyyam: false, ayyamDay: 0};
  } else if (bahaiDoy <= 342 + ayyamLength) {
    return {year: bahaiYear, month: 0, day: 0, isAyyam: true, ayyamDay: bahaiDoy - 342};
  } else {
    var day19 = bahaiDoy - 342 - ayyamLength;
    return {year: bahaiYear, month: 19, day: day19, isAyyam: false, ayyamDay: 0};
  }
}

function formatBahaiDate(bd) {
  if (bd.isAyyam) {
    return "Ayyám-i-Há " + bd.ayyamDay;
  }
  return BAHAI_MONTHS[bd.month - 1] + " " + bd.day;
}

// ── SUNSET CALCULATION ─────────────────────────────────────────────────────
// Standard NOAA/Almanac formula, accurate to ~1-2 minutes
function calcSunset(lat, lng, date) {
  var rad = Math.PI / 180;
  var JD = (date.getTime() / 86400000) + 2440587.5;
  var n = Math.floor(JD - 2451545.0 + 0.5);
  var Lsun = (280.46 + 0.9856474 * n) % 360;
  var Msun = (357.528 + 0.9856003 * n) % 360;
  var lambda = Lsun + 1.915 * Math.sin(Msun * rad) + 0.020 * Math.sin(2 * Msun * rad);
  var sinDec = Math.sin(23.439 * rad) * Math.sin(lambda * rad);
  var cosDec = Math.cos(Math.asin(sinDec));
  // Hour angle for sunset (zenith = 90.833 including refraction and solar disc)
  var cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
  if (cosH < -1) return null; // midnight sun
  if (cosH > 1) return null;  // polar night
  var H = Math.acos(cosH) / rad; // degrees
  // Sunset time in UTC hours
  var utcSunset = 12 + H/15 - lng/15;
  // Adjust for equation of time
  utcSunset = utcSunset % 24;
  return utcSunset; // hours in UTC
}

// ── STATE ──────────────────────────────────────────────────────────────────
var state = {favourites:[], removed:[], moreLike:[], queue:[], qIdx:0, lat:null, lng:null};
var currentId = null;
var sessionHistory = [];

function saveState(){try{localStorage.setItem('bahai_v3',JSON.stringify(state));}catch(e){}}
function loadState(){
  try{
    var s=localStorage.getItem('bahai_v3');
    if(s){var p=JSON.parse(s);
      state.favourites=p.favourites||[];
      state.removed=p.removed||[];
      state.moreLike=p.moreLike||[];
      state.lat=p.lat||null;
      state.lng=p.lng||null;
    }
  }catch(e){}
}

// ── DATE/TIME HEADER ───────────────────────────────────────────────────────
function updateHeader(sunsetUTC) {
  var now = new Date();
  var h = now.getHours();
  var utcH = now.getUTCHours() + now.getUTCMinutes()/60;

  // Is it after sunset?
  var afterSunset = false;
  if (sunsetUTC !== null && sunsetUTC !== undefined) {
    afterSunset = utcH >= sunsetUTC;
  } else {
    // Fallback: sunset at 18:00 local
    afterSunset = h >= 18;
  }

  // Period label
  var period;
  if (h >= 5 && h < 12) period = "Morning";
  else if (h >= 12 && !afterSunset) period = "Afternoon";
  else period = "Evening";

  // Gregorian date (no year, no weekday): "16 June"
  var gregOpts = {day:"numeric", month:"long"};
  var gregStr = now.toLocaleDateString("en-GB", gregOpts);

  // Bahá'í date: if after sunset, use tomorrow's Gregorian date for the conversion
  var bahaiBase = new Date(now);
  if (afterSunset) {
    bahaiBase.setDate(bahaiBase.getDate() + 1);
  }
  var bd = toBahaiDate(bahaiBase);
  var bahaiStr = formatBahaiDate(bd);

  document.getElementById("d-greg").textContent = gregStr;
  document.getElementById("d-period").textContent = period;
  document.getElementById("d-bahai").textContent = bahaiStr;
  document.getElementById("d-sr").textContent = gregStr + ", " + period + ", " + bahaiStr;
}

function getSunsetAndUpdate() {
  // If we have stored coords and today's sunset, use them
  var today = new Date().toDateString();
  try {
    var stored = JSON.parse(localStorage.getItem("bahai_sun")||"{}");
    if (stored.date === today && stored.sunset !== undefined && stored.lat) {
      state.lat = stored.lat;
      state.lng = stored.lng;
      updateHeader(stored.sunset);
      return;
    }
  } catch(e) {}

  // If we have coords from state, recalculate for today
  if (state.lat !== null && state.lng !== null) {
    var sunset = calcSunset(state.lat, state.lng, new Date());
    try { localStorage.setItem("bahai_sun", JSON.stringify({date:today, sunset:sunset, lat:state.lat, lng:state.lng})); } catch(e){}
    updateHeader(sunset);
    return;
  }

  // No coords yet — try geolocation
  updateHeader(null); // show with fallback first
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        state.lat = pos.coords.latitude;
        state.lng = pos.coords.longitude;
        saveState();
        var sunset = calcSunset(state.lat, state.lng, new Date());
        try { localStorage.setItem("bahai_sun", JSON.stringify({date:today, sunset:sunset, lat:state.lat, lng:state.lng})); } catch(e){}
        updateHeader(sunset);
      },
      function() {
        // Permission denied or unavailable — keep fallback
        updateHeader(null);
      },
      {timeout:8000, maximumAge:86400000}
    );
  }
}

// ── PASSAGE ENGINE ─────────────────────────────────────────────────────────
function buildQueue(){
  var avail=PASSAGES.filter(function(p){return state.removed.indexOf(p.id)===-1;});
  if(!avail.length) return PASSAGES.map(function(p){return p.id;});
  var tagScore={};
  state.moreLike.forEach(function(id){
    var p=PASSAGES.filter(function(x){return x.id===id;})[0];
    if(p) p.tags.forEach(function(t){tagScore[t]=(tagScore[t]||0)+2;});
  });
  var scored=avail.map(function(p){
    var sc=1;
    p.tags.forEach(function(t){if(tagScore[t]) sc+=tagScore[t];});
    return {id:p.id,sc:sc};
  });
  var result=[],pool=scored.slice();
  while(pool.length){
    var tot=0;
    pool.forEach(function(x){tot+=x.sc;});
    var r=Math.random()*tot;
    for(var i=0;i<pool.length;i++){r-=pool[i].sc;if(r<=0){result.push(pool[i].id);pool.splice(i,1);break;}}
  }
  return result;
}

function showPassage(id){
  currentId=id;
  // Push to session history if it's a new forward navigation
  if(sessionHistory.length === 0 || sessionHistory[sessionHistory.length-1] !== id){
    sessionHistory.push(id);
  }
  updatePrevBtn();
  var p=PASSAGES.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  document.getElementById("ptxt").textContent=p.text;
  document.getElementById("psrc").innerHTML="— "+p.source+", <em>"+p.work+"</em>";
  var bf=document.getElementById("btn-fav");
  var bm=document.getElementById("btn-more");
  if(state.favourites.indexOf(id)!==-1){bf.classList.add("fav-on");bf.querySelector("svg").setAttribute("fill","currentColor");}
  else{bf.classList.remove("fav-on");bf.querySelector("svg").setAttribute("fill","none");}
  if(state.moreLike.indexOf(id)!==-1) bm.classList.add("more-on");
  else bm.classList.remove("more-on");
}

function nextPassage(){
  if(!state.queue.length){state.queue=buildQueue();state.qIdx=0;}
  var tries=0;
  while(tries<state.queue.length){
    var id=state.queue[state.qIdx%state.queue.length];
    state.qIdx++;
    if(state.removed.indexOf(id)===-1){showPassage(id);saveState();return;}
    tries++;
  }
  showPassage(PASSAGES[0].id);
}

function prevPassage(){
  if(sessionHistory.length < 2) return;
  // Remove current from history
  sessionHistory.pop();
  // Skip back over any passages the user has hidden
  while(sessionHistory.length > 0 && state.removed.indexOf(sessionHistory[sessionHistory.length-1]) !== -1){
    sessionHistory.pop();
  }
  if(sessionHistory.length === 0){ updatePrevBtn(); return; }
  // Get the previous
  var id = sessionHistory[sessionHistory.length-1];
  currentId = id;
  var p = PASSAGES.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  document.getElementById("ptxt").textContent = p.text;
  document.getElementById("psrc").innerHTML = "— "+p.source+", <em>"+p.work+"</em>";
  var bf = document.getElementById("btn-fav");
  var bm = document.getElementById("btn-more");
  if(state.favourites.indexOf(id)!==-1){bf.classList.add("fav-on");bf.querySelector("svg").setAttribute("fill","currentColor");}
  else{bf.classList.remove("fav-on");bf.querySelector("svg").setAttribute("fill","none");}
  if(state.moreLike.indexOf(id)!==-1) bm.classList.add("more-on");
  else bm.classList.remove("more-on");
  updatePrevBtn();
}

function updatePrevBtn(){
  var btn = document.getElementById("btn-prev");
  if(!btn) return;
  if(sessionHistory.length < 2){
    btn.disabled = true;
    btn.setAttribute("aria-disabled","true");
    btn.classList.add("prev-dim");
  } else {
    btn.disabled = false;
    btn.setAttribute("aria-disabled","false");
    btn.classList.remove("prev-dim");
  }
}

function toggleFav(){
  if(!currentId) return;
  var idx=state.favourites.indexOf(currentId);
  var bf=document.getElementById("btn-fav");
  if(idx===-1){
    state.favourites.push(currentId);
    bf.classList.add("fav-on");
    bf.querySelector("svg").setAttribute("fill","currentColor");
    toast("Added to favourites ❆");
  } else {
    state.favourites.splice(idx,1);
    bf.classList.remove("fav-on");
    bf.querySelector("svg").setAttribute("fill","none");
    toast("Removed from favourites");
  }
  saveState();
}

function toggleMore(){
  if(!currentId) return;
  var idx=state.moreLike.indexOf(currentId);
  var bm=document.getElementById("btn-more");
  if(idx===-1){
    state.moreLike.push(currentId);
    bm.classList.add("more-on");
    state.queue=buildQueue();state.qIdx=0;
    toast("More similar themed readings will follow");
  } else {
    state.moreLike.splice(idx,1);
    bm.classList.remove("more-on");
    state.queue=buildQueue();state.qIdx=0;
    toast("Preference cleared");
  }
  saveState();
}

function hidePassage(){
  if(!currentId) return;
  if(state.removed.indexOf(currentId)===-1) state.removed.push(currentId);
  state.favourites=state.favourites.filter(function(x){return x!==currentId;});
  saveState();
  toast("Moved to Hidden");
  nextPassage();
}

function showTab(name){
  ["reading","favourites","hidden"].forEach(function(t){
    var sec=document.getElementById("section-"+t);
    if(sec){sec.style.display="none";sec.classList.remove("vis");}
  });
  document.querySelectorAll(".tab").forEach(function(t){
    t.classList.remove("active");
    t.setAttribute("aria-selected","false");
  });
  var sec=document.getElementById("section-"+name);
  if(sec){sec.style.display="block";sec.classList.add("vis");}
  var tidMap={reading:"t-read",favourites:"t-fav",hidden:"t-hid"};
  var tel=document.getElementById(tidMap[name]);
  if(tel){tel.classList.add("active");tel.setAttribute("aria-selected","true");}
  if(name==="favourites") renderFav();
  if(name==="hidden") renderHidden();
}

function renderFav(){
  var el=document.getElementById("fav-list");
  if(!state.favourites.length){el.innerHTML='<div class="empty"><span class="egold">❆</span>No favourites yet.<br>Star a passage to save it here.</div>';return;}
  el.innerHTML=state.favourites.map(function(id){
    var p=PASSAGES.filter(function(x){return x.id===id;})[0];
    if(!p) return "";
    return '<li class="sitem"><div class="stext">'+p.text+'<div class="ssrc">— '+p.source+', <em>'+p.work+'</em></div></div><button class="sdel" onclick="removeFav('+id+')" aria-label="Remove from favourites">×</button></li>';
  }).join("");
}

function removeFav(id){state.favourites=state.favourites.filter(function(x){return x!==id;});saveState();renderFav();}

function renderHidden(){
  var el=document.getElementById("hid-list");
  if(!state.removed.length){el.innerHTML='<div class="empty">No hidden passages.</div>';return;}
  el.innerHTML=state.removed.map(function(id){
    var p=PASSAGES.filter(function(x){return x.id===id;})[0];
    if(!p) return "";
    var s=p.text.length>120?p.text.slice(0,117)+"…":p.text;
    return '<li class="sitem"><div class="stext">'+s+'<div class="ssrc">— '+p.source+'</div></div><button class="sdel restore" onclick="restorePassage('+id+')" aria-label="Restore passage">↺</button></li>';
  }).join("");
}

function restorePassage(id){
  state.removed=state.removed.filter(function(x){return x!==id;});
  state.queue=buildQueue();state.qIdx=0;
  saveState();renderHidden();toast("Passage restored");
}

var toastTimer, toastClear;
function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toastTimer);clearTimeout(toastClear);
  toastTimer=setTimeout(function(){el.classList.remove("show");},2400);
  toastClear=setTimeout(function(){el.textContent="";},2700);
}

// ── LIVE HEADER UPDATE ────────────────────────────────────────────────────
// Rechecks every 60 seconds so the period and Bahá'í date flip at the right moment
function startHeaderTimer() {
  setInterval(function() {
    var today = new Date().toDateString();
    try {
      var stored = JSON.parse(localStorage.getItem('bahai_sun')||'{}');
      if (stored.date === today && stored.sunset !== undefined) {
        updateHeader(stored.sunset);
        return;
      }
    } catch(e) {}
    updateHeader(null);
  }, 60000);
}

// ── VERSION CHECK ──────────────────────────────────────────────────────────────────
function updateApp() {
  try { localStorage.setItem("bahai_prev_version", VERSION); } catch(e) {}
  toast("Checking for update…");
  setTimeout(function() { window.location.reload(true); }, 900);
}

function checkVersion() {
  var verEl = document.getElementById("vernum");
  if (verEl) verEl.textContent = "Version " + VERSION;
  try {
    var prev = localStorage.getItem("bahai_prev_version");
    if (prev && prev !== VERSION) {
      localStorage.removeItem("bahai_prev_version");
      toast("App updated to version " + VERSION + " ✔");
    } else if (prev && prev === VERSION) {
      localStorage.removeItem("bahai_prev_version");
      toast("Already up to date");
    }
  } catch(e) {}
}

// ── INIT ───────────────────────────────────────────────────────────────────
loadState();
getSunsetAndUpdate();
startHeaderTimer();
checkVersion();
["favourites","hidden"].forEach(function(t){var s=document.getElementById("section-"+t);if(s)s.style.display="none";});
document.getElementById("section-reading").style.display="block";
state.queue=buildQueue();
state.qIdx=0;
nextPassage();
updatePrevBtn();
</script>
</body>
