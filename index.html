<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Readings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--gold:#b8965a;--gold-light:#e8d5a8;--gold-dark:#7a5f2e;--cream:#faf7f0;--cream-dark:#ede6d5;--text:#2c1f0e;--text-mid:#5c4530;--text-soft:#9a7d5e;--bg:#faf7f0;--card:#ffffff;--border:rgba(184,150,90,0.25)}
@media(prefers-color-scheme:dark){:root{--gold:#c9a96e;--gold-light:#e8d5a8;--gold-dark:#c9a96e;--cream:#2a1f10;--cream-dark:#1f1608;--text:#f0e6d0;--text-mid:#c8a97a;--text-soft:#8a6d4a;--bg:#1a1208;--card:#221a0f;--border:rgba(184,150,90,0.2)}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px}
.header{width:100%;text-align:center;padding:16px 12px 12px;border-bottom:1px solid var(--border);background:var(--bg)}
.hstar{display:flex;justify-content:center;margin-bottom:5px}
.header h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(19px,5vw,24px);color:var(--text);letter-spacing:.04em}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:4px;width:100%}
.datebar-greg{font-size:clamp(10px,2.8vw,12px);color:var(--text-soft);font-weight:600;letter-spacing:.04em;font-family:'Jost',sans-serif;text-align:left;flex:1;white-space:nowrap}
.datebar-period{font-size:clamp(10px,2.8vw,12px);color:var(--gold);font-weight:400;letter-spacing:.07em;text-transform:none;font-family:'Jost',sans-serif;text-align:center;flex:0 0 auto;padding:0 6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.datebar-sep{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.datebar-bahai{font-size:clamp(10px,2.8vw,12px);color:var(--text-soft);font-weight:600;letter-spacing:.04em;font-family:'Jost',sans-serif;text-align:right;flex:1;white-space:nowrap}
.content{width:100%;max-width:560px;padding:0 12px}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-top:14px}
.tab{flex:1;text-align:center;padding:10px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;font-family:'Jost',sans-serif;-webkit-tap-highlight-color:transparent}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover:not(.active){color:var(--text-mid)}
#section-reading{padding-top:16px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(18px,5vw,28px) clamp(16px,5vw,24px) 16px;margin-bottom:12px;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-light),var(--gold))}
.porn{text-align:center;font-size:18px;color:var(--gold);margin-bottom:12px;opacity:.7}
.ptxt{font-family:'Cormorant Garamond',serif;font-size:clamp(17px,4.5vw,20px);line-height:1.8;color:var(--text);font-style:italic;text-align:center}
.psrc{margin-top:14px;text-align:right;font-size:12px;color:var(--text-soft);font-weight:300;letter-spacing:.04em;font-family:'Jost',sans-serif}
.psrc em{font-style:italic}
.ptags{display:none}
.tag{display:none}
.actions{display:flex;gap:7px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.abtn{display:flex;align-items:center;gap:5px;padding:9px 13px;border-radius:30px;border:1px solid var(--border);background:var(--card);color:var(--text-mid);font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;min-height:44px}
.abtn:hover{background:var(--cream-dark)}
.abtn:active{transform:scale(.97)}
.abtn svg{width:15px;height:15px;flex-shrink:0}
.abtn.fav-on{background:#fff8e8;border-color:var(--gold);color:var(--gold-dark)}
.abtn.fav-on svg{fill:var(--gold);stroke:var(--gold)}
@media(prefers-color-scheme:dark){.abtn.fav-on{background:#2a2010}}
.abtn.more-on{background:#f0f8ee;border-color:#7ab06a;color:#3a6830}
@media(prefers-color-scheme:dark){.abtn.more-on{background:#0f1f0c;border-color:#4a7040;color:#8ac07a}}
.nextwrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.nxtbtn{background:var(--gold);color:#fff;border:none;border-radius:30px;padding:13px 36px;font-family:'Jost',sans-serif;font-size:15px;letter-spacing:.05em;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;min-height:48px}
.nxtbtn:hover{background:var(--gold-dark)}
.nxtbtn:active{transform:scale(.98)}
.prevbtn{background:none;color:var(--gold);border:1.5px solid var(--gold);border-radius:30px;padding:13px 28px;font-family:'Jost',sans-serif;font-size:15px;letter-spacing:.05em;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;min-height:48px}
.prevbtn:hover:not(:disabled){background:var(--cream-dark)}
.prevbtn:active:not(:disabled){transform:scale(.98)}
.prev-dim{opacity:0.35;cursor:default;border-color:var(--text-soft);color:var(--text-soft)}
.saved-sec{display:none;padding-top:12px}
.saved-sec.vis{display:block}
.saved-list{list-style:none}
.sitem{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:9px;display:flex;gap:9px;align-items:flex-start}
.stext{flex:1;font-family:'Cormorant Garamond',serif;font-size:clamp(14px,4vw,16px);line-height:1.55;font-style:italic;color:var(--text)}
.ssrc{font-size:11px;color:var(--text-soft);margin-top:4px;font-style:normal;font-family:'Jost',sans-serif}
.sdel{background:none;border:none;cursor:pointer;color:var(--text-soft);font-size:20px;padding:4px;line-height:1;flex-shrink:0;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.sdel:hover{color:#c0392b}
.sdel.restore{color:var(--gold)}
.sdel.restore:hover{color:var(--gold-dark)}
.empty{text-align:center;color:var(--text-soft);font-size:14px;padding:28px 0;line-height:1.7}
.egold{color:var(--gold);font-size:20px;display:block;margin-bottom:6px}
.hint{font-size:11px;color:var(--text-soft);margin-bottom:8px;line-height:1.6;font-family:'Jost',sans-serif}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 20px;border-radius:30px;font-size:13px;font-family:'Jost',sans-serif;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;z-index:99;max-width:90vw}
.toast.show{opacity:1}
.verbar{width:100%;text-align:center;padding:16px 12px 20px;margin-top:8px}
.verbar-inner{display:inline-flex;align-items:center;gap:10px}
.vernum{font-size:11px;color:var(--text-soft);font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.05em}
.updbtn{font-size:11px;color:var(--gold);font-family:'Jost',sans-serif;font-weight:400;background:none;border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;letter-spacing:.04em;-webkit-tap-highlight-color:transparent}
.updbtn:hover{background:var(--cream-dark)}
</style>
</head>
<body>
<div class="header">
  <div class="hstar">
    <svg width="46" height="46" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Nine-pointed star" role="img">
      <polygon points="50.000,4.000 57.182,30.266 79.568,14.762 68.187,39.500 95.301,42.012 70.681,53.647 89.837,73.000 63.499,66.087 65.733,93.226 50.000,71.000 34.267,93.226 36.501,66.087 10.163,73.000 29.319,53.647 4.699,42.012 31.813,39.500 20.432,14.762 42.818,30.266" fill="none" stroke="#b8965a" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Daily Readings</h1>
  <p class="sr-only" id="d-sr">Loading</p>
  <div class="datebar" aria-hidden="true">
    <span class="datebar-greg" id="d-greg"></span>
    <span class="datebar-period" id="d-period"></span>
    <span class="datebar-bahai" id="d-bahai"></span>
  </div>
</div>

<div class="content">
  <div class="tabs" role="tablist">
    <div class="tab active" id="t-read" role="tab" tabindex="0" aria-selected="true" onclick="showTab('reading')" onkeydown="if(event.key==='Enter'||event.key===' ')showTab('reading')">Readings</div>
    <div class="tab" id="t-fav" role="tab" tabindex="0" aria-selected="false" onclick="showTab('favourites')" onkeydown="if(event.key==='Enter'||event.key===' ')showTab('favourites')">Favourites</div>
    <div class="tab" id="t-hid" role="tab" tabindex="0" aria-selected="false" onclick="showTab('hidden')" onkeydown="if(event.key==='Enter'||event.key===' ')showTab('hidden')">Hidden</div>
  </div>

  <div id="section-reading">
    <div class="pcard" id="pcard" aria-live="polite" aria-atomic="true">
      <div class="porn" aria-hidden="true">✦</div>
      <p class="ptxt" id="ptxt">Loading...</p>
      <p class="psrc" id="psrc"></p>
      <div class="ptags" id="ptags" aria-hidden="true" style="display:none"></div>
    </div>
    <div class="actions">
      <button class="abtn" id="btn-fav" onclick="toggleFav()" aria-label="Save to favourites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Favourite
      </button>
      <button class="abtn" id="btn-more" onclick="toggleMore()" aria-label="Show more like this">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        More like this
      </button>
      <button class="abtn" id="btn-hide" onclick="hidePassage()" aria-label="Hide this">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        Hide this
      </button>
    </div>
    <div class="nextwrap">
      <button class="prevbtn prev-dim" id="btn-prev" onclick="prevPassage()" aria-label="Previous passage" aria-disabled="true" disabled>‹ Previous</button>
      <button class="nxtbtn" onclick="nextPassage()">Next passage ›</button>
    </div>
  </div>

  <div id="section-favourites" class="saved-sec">
    <ul class="saved-list" id="fav-list"></ul>
  </div>

  <div id="section-hidden" class="saved-sec">
    <p class="hint">Passages you have chosen not to see again. Tap the arrow to restore.</p>
    <ul class="saved-list" id="hid-list"></ul>
  </div>
</div>

<div class="verbar">
  <div class="verbar-inner">
    <span class="vernum" id="vernum" aria-live="polite"></span>
    <button class="updbtn" onclick="updateApp()" aria-label="Update app">Update app</button>
  </div>
</div>
<div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>

<script>
var VERSION = "1.9";
var PASSAGES = [{"id":2,"text":"Religion and science are the two wings upon which man's intelligence can soar into the heights, with which the human soul can progress. It is not possible to fly with one wing alone!","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["science","reason","unity"]},{"id":3,"text":"Any religion that contradicts science or that is opposed to it, is only ignorance — for ignorance is the opposite of knowledge.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["science","reason","knowledge"]},{"id":4,"text":"God has given man the eye of investigation by which he may see and recognize truth.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["science","reason","knowledge"]},{"id":7,"text":"Scientific knowledge is the highest attainment upon the human plane, for science is the discoverer of realities.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["science","knowledge"]},{"id":8,"text":"All blessings are divine in origin, but none can be compared with this power of intellectual investigation and research, which is an eternal gift producing fruits of unending delight.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["science","knowledge","reason"]},{"id":10,"text":"It is not for him to pride himself who loveth his own country, but rather for him who loveth the whole world. The earth is but one country, and mankind its citizens.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["unity","social","global"]},{"id":11,"text":"The well-being of mankind, its peace and security, are unattainable unless and until its unity is firmly established.","source":"Bahá'u'lláh","work":"Gleanings","tags":["unity","peace","social"]},{"id":12,"text":"So powerful is the light of unity that it can illuminate the whole earth.","source":"Bahá'u'lláh","work":"Epistle to the Son of the Wolf","tags":["unity","social"]},{"id":13,"text":"We desire but the good of the world and the happiness of the nations; yet they deem Us a stirrer up of strife and sedition worthy of bondage and banishment.","source":"Bahá'u'lláh","work":"Proclamation of Bahá'u'lláh","tags":["unity","peace","social"]},{"id":15,"text":"The utterance of God is a lamp, whose light is these words: Ye are the fruits of one tree, and the leaves of one branch. Deal ye one with another with the utmost love and harmony, with friendliness and fellowship.","source":"Bahá'u'lláh","work":"Epistle to the Son of the Wolf","tags":["unity","love","social"]},{"id":16,"text":"The Great Being, wishing to reveal the prerequisites of the peace and tranquility of the world and the advancement of its peoples, hath written: The time must come when the imperative necessity for the holding of a vast, an all-embracing assemblage of men will be universally realized.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["unity","global","social","governance"]},{"id":17,"text":"That which the Lord hath ordained as the sovereign remedy and mightiest instrument for the healing of all the world is the union of all its peoples in one universal Cause, one common Faith.","source":"Bahá'u'lláh","work":"Gleanings","tags":["unity","global","social"]},{"id":18,"text":"All men have been created to carry forward an ever-advancing civilization. The Almighty beareth Me witness: To act like the beasts of the field is unworthy of man.","source":"Bahá'u'lláh","work":"Gleanings","tags":["civilisation","social","action","progress"]},{"id":19,"text":"The world of humanity has two wings — one is women and the other men. Not until both wings are equally developed can the bird fly.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["equality","social","women","progress"]},{"id":20,"text":"Women have equal rights with men upon earth; in religion and society they are a very important element. As long as women are prevented from attaining their highest possibilities, so long will men be unable to achieve the greatness which might be theirs.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["equality","women","social","progress"]},{"id":23,"text":"The time must come when the imperative necessity for the holding of a vast, an all-embracing assemblage of men will be universally realized. The rulers and kings of the earth must needs attend it, and, participating in its deliberations, must consider such ways and means as will lay the foundations of the world's Great Peace amongst men.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["peace","governance","global","social"]},{"id":24,"text":"Be united, O kings of the earth, for thereby will the tempest of discord be stilled amongst you, and your peoples find rest.","source":"Bahá'u'lláh","work":"Gleanings","tags":["peace","governance","unity","global"]},{"id":25,"text":"Should any king take up arms against another, all should unitedly arise and prevent him. If this be done, the nations of the world will no longer require any armaments, except for the purpose of preserving the security of their realms.","source":"Bahá'u'lláh","work":"Gleanings","tags":["peace","governance","global","social"]},{"id":26,"text":"God maketh no distinction between the white and the black. If the hearts are pure both are acceptable unto Him. God is no respecter of persons on account of either color or race.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["prejudice","equality","social","race"]},{"id":27,"text":"The heaven of divine wisdom is illumined with the two luminaries of consultation and compassion. Take ye counsel together in all matters, inasmuch as consultation is the lamp of guidance which leadeth the way, and is the bestower of understanding.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["consultation","governance","social","practical"]},{"id":29,"text":"In the estimation of God all men are equal; there is no distinction or preferment for any soul in the dominion of His justice and equity.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["equality","justice","social","prejudice"]},{"id":31,"text":"O Children of Men! Know ye not why We created you all from the same dust? That no one should exalt himself over the other.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["justice","equality","social"]},{"id":32,"text":"The arrangements of the circumstances of the people must be such that poverty shall disappear, that everyone, as far as possible, according to his rank and position, shall share in comfort and well-being.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["economics","social","justice","poverty"]},{"id":33,"text":"We see amongst us men who are overburdened with riches on the one hand, and on the other those unfortunate ones who starve with nothing; those who possess several stately palaces, and those who have not where to lay their head.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["economics","poverty","justice","social"]},{"id":34,"text":"Wealth is praiseworthy in the highest degree, if it is acquired by an individual's own efforts and the grace of God, in commerce, agriculture, art and industry, and if it be expended for philanthropic purposes.","source":"'Abdu'l-Bahá","work":"The Secret of Divine Civilisation","tags":["economics","service","practical","action"]},{"id":35,"text":"O ye rich ones on earth! The poor in your midst are My trust; guard ye My trust, and be not intent only on your own ease.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["economics","poverty","justice","service"]},{"id":36,"text":"Regard man as a mine rich in gems of inestimable value. Education can, alone, cause it to reveal its treasures, and enable mankind to benefit therefrom.","source":"Bahá'u'lláh","work":"Gleanings","tags":["education","knowledge","social","progress"]},{"id":37,"text":"It is incumbent upon the father and mother to train their children both in good conduct and the study of books; study, that is, to the degree required, so that no child, whether girl or boy, will remain illiterate.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["education","family","practical","action"]},{"id":38,"text":"Training in morals and good conduct is far more important than book learning. A child that is cleanly, agreeable, of good character, well-behaved—even though he be ignorant—is preferable to a child that is rude, unwashed, ill-natured, and yet becoming deeply versed in all the sciences and arts.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["education","character","practical","family"]},{"id":39,"text":"The education and training of children is among the most meritorious acts of humankind and draweth down the grace and favor of the All-Merciful.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["education","family","service","action"]},{"id":40,"text":"Schools must first train the children in the principles of religion, so that the Promise and the Threat recorded in the Books of God may prevent them from the things forbidden and adorn them with the mantle of the commandments; but this in such a measure that it may not injure the children by resulting in ignorant fanaticism.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["education","knowledge","reason","practical"]},{"id":41,"text":"It is incumbent upon each one of you to engage in some occupation — such as a craft, a trade or the like. We have exalted your engagement in such work to the rank of worship of the one true God.","source":"Bahá'u'lláh","work":"The Kitáb-i-Aqdas","tags":["work","practical","action","service"]},{"id":42,"text":"The man who makes a piece of notepaper to the best of his ability, conscientiously, concentrating all his forces on perfecting it, is giving praise to God.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["work","practical","action","character"]},{"id":43,"text":"Waste not your time in idleness and sloth. Occupy yourselves with that which profiteth yourselves and others.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["work","action","practical","service"]},{"id":44,"text":"That one indeed is a man who, today, dedicateth himself to the service of the entire human race.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["service","action","social","work"]},{"id":45,"text":"Consultation bestoweth greater awareness and transmuteth conjecture into certitude. It is a shining light which, in a dark world, leadeth the way and guideth.","source":"Bahá'u'lláh","work":"Consultation: A Compilation","tags":["consultation","knowledge","practical","governance"]},{"id":46,"text":"In all things it is necessary to consult. This matter should be forcibly stressed by thee, so that consultation may be observed by all.","source":"'Abdu'l-Bahá","work":"Consultation: A Compilation","tags":["consultation","governance","practical","action"]},{"id":47,"text":"When every member expresseth with absolute freedom his own opinion and setteth forth his argument, should anyone oppose, he must on no account feel hurt, for not until matters are fully discussed can the right way be revealed. The shining spark of truth cometh forth only after the clash of differing opinions.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["consultation","governance","practical","social"]},{"id":48,"text":"Be generous in prosperity, and thankful in adversity. Be worthy of the trust of thy neighbour, and look upon him with a bright and friendly face.","source":"Bahá'u'lláh","work":"Epistle to the Son of the Wolf","tags":["character","practical","service","social"]},{"id":49,"text":"Be a treasure to the poor, an admonisher to the rich, an answerer of the cry of the needy, a preserver of the sanctity of thy pledge.","source":"Bahá'u'lláh","work":"Epistle to the Son of the Wolf","tags":["service","character","practical","economics"]},{"id":50,"text":"Let your vision be world-embracing, rather than confined to your own self.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["character","social","global","practical"]},{"id":51,"text":"Blessed is he who preferreth his brother before himself.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["service","character","practical","love"]},{"id":52,"text":"Be an ornament to the countenance of truth, a crown to the brow of fidelity, a pillar of the temple of righteousness, a breath of life to the body of mankind.","source":"Bahá'u'lláh","work":"Gleanings","tags":["character","action","practical","social"]},{"id":53,"text":"Beware lest ye offend the feelings of anyone, or sadden the heart of any person, or move the tongue in reproach of and finding fault with anybody, whether he is friend or stranger, believer or enemy.","source":"'Abdu'l-Bahá","work":"Tablets of 'Abdu'l-Bahá","tags":["character","conduct","practical","social"]},{"id":54,"text":"Consort with all the peoples, kindreds and religions of the world with the utmost truthfulness, uprightness, faithfulness, kindliness, goodwill and friendliness.","source":"'Abdu'l-Bahá","work":"The Will and Testament of 'Abdu'l-Bahá","tags":["conduct","character","social","practical"]},{"id":55,"text":"A kindly tongue is the lodestone of the hearts of men. It is the bread of the spirit, it clotheth the words with meaning, it is the fountain of the light of wisdom and understanding.","source":"Bahá'u'lláh","work":"Gleanings from the Writings of Bahá'u'lláh","tags":["communication","character","practical","social"]},{"id":56,"text":"In this Day the secrets of the earth are laid bare before the eyes of men. The pages of swiftly-appearing newspapers are indeed the mirror of the world.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["communication","knowledge","social","progress"]},{"id":57,"text":"It behooveth the sovereigns of the world—may God assist them—or the ministers of the earth to take counsel together and to adopt one of the existing languages or a new one to be taught to children in schools throughout the world.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["global","unity","social","governance","language"]},{"id":58,"text":"The day is approaching when all the peoples of the world will have adopted one universal language and one common script. When this is achieved, to whatsoever city a man may journey, it shall be as if he were entering his own home.","source":"Bahá'u'lláh","work":"Gleanings","tags":["global","unity","social","progress","language"]},{"id":59,"text":"Nature in its essence is the embodiment of My Name, the Maker, the Creator. Its manifestations are diversified by varying causes, and in this diversity there are signs for men of discernment.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["nature","science","creation","knowledge"]},{"id":60,"text":"The civilization, so often vaunted by the learned exponents of arts and sciences, will, if allowed to overleap the bounds of moderation, bring great evil upon men.","source":"Bahá'u'lláh","work":"Gleanings","tags":["civilisation","moderation","social","progress"]},{"id":61,"text":"Man is organic with the world. His inner life moulds the environment and is itself also deeply affected by it. The one acts upon the other and every abiding change in the life of man is the result of these mutual reactions.","source":"Shoghi Effendi","work":"Social Action: A Compilation","tags":["nature","social","progress","science"]},{"id":62,"text":"Trustworthiness is the greatest portal leading unto the tranquility and security of the people. In truth the stability of every affair hath depended and doth depend upon it.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["character","practical","governance","social"]},{"id":63,"text":"Let integrity and uprightness distinguish all thine acts. Be a home for the stranger, a balm to the suffering, a tower of strength for the fugitive.","source":"Bahá'u'lláh","work":"Gleanings","tags":["character","practical","service","conduct"]},{"id":64,"text":"Beware, O people of Bahá, lest ye walk in the ways of them whose words differ from their deeds. Strive that ye may be enabled to manifest to the peoples of the earth the signs of God, and to mirror forth His commandments.","source":"Bahá'u'lláh","work":"Gleanings","tags":["character","conduct","practical","truth"]},{"id":65,"text":"The purpose of justice is the appearance of unity among men.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["justice","unity","social","governance"]},{"id":66,"text":"O people of God! That which traineth the world is Justice, for it is upheld by two pillars, reward and punishment. These two pillars are the sources of life to the world.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["justice","governance","social","practical"]},{"id":67,"text":"The light of men is Justice. Quench it not with the contrary winds of oppression and tyranny.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["justice","social","governance"]},{"id":68,"text":"Resort ye, in times of sickness, to competent physicians; We have not set aside the use of material means, rather have We confirmed it through this Pen.","source":"Bahá'u'lláh","work":"The Kitáb-i-Aqdas","tags":["practical","science","knowledge","action"]},{"id":70,"text":"Lay not on any soul a load which ye would not wish to be laid upon you, and desire not for anyone the things ye would not desire for yourselves. This is My best counsel unto you, did ye but observe it.","source":"Bahá'u'lláh","work":"Gleanings","tags":["practical","conduct","social","character"]},{"id":71,"text":"It is incumbent upon every man of insight and understanding to strive to translate that which hath been written into reality and action.","source":"Bahá'u'lláh","work":"Gleanings","tags":["action","practical","knowledge","progress"]},{"id":72,"text":"Let deeds, not words, be your adorning.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["action","practical","conduct","character"]},{"id":73,"text":"Blessed is he who mingleth with all men in a spirit of utmost kindliness and love.","source":"Bahá'u'lláh","work":"Gleanings from the Writings of Bahá'u'lláh","tags":["social","conduct","practical","love"]},{"id":75,"text":"Do not busy yourselves in your own concerns; let your thoughts be fixed upon that which will rehabilitate the fortunes of mankind and sanctify the hearts and souls of men.","source":"Bahá'u'lláh","work":"Gleanings","tags":["service","social","action","detachment"]},{"id":78,"text":"Weigh carefully in the balance of reason and science everything that is presented to you as religion. If it passes this test, then accept it, for it is truth.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["science","reason","knowledge","practical"]},{"id":80,"text":"Science is the first emanation from God toward man. All created beings embody the potentiality of material perfection, but the power of intellectual investigation and scientific acquisition is a higher virtue specialized to man alone.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["science","knowledge","reason","progress"]},{"id":81,"text":"The greatest attainment in the world of humanity has ever been scientific in nature. It is the discovery of the realities of things.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["science","reason","knowledge","progress"]},{"id":83,"text":"When a thought of war comes, oppose it by a stronger thought of peace. A thought of hatred must be destroyed by a more powerful thought of love.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["peace","social","practical","action"]},{"id":84,"text":"The diversity in the human family should be the cause of love and harmony, as it is in music where many different notes blend together in the making of a perfect chord.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["unity","social","love","diversity"]},{"id":86,"text":"The betterment of the world can be accomplished through pure and goodly deeds, through commendable and seemly conduct.","source":"Bahá'u'lláh","work":"Gleanings from the Writings of Bahá'u'lláh","tags":["action","conduct","social","practical"]},{"id":87,"text":"O ye friends of the East and the West! Among the foundations of the religion of God, the inner significances of the Word of God, and the duties of the friends of God, the greatest is cooperation and mutual aid, for the realm of humanity—nay, all the innumerable beings found in the world of existence—depend upon it. Should cooperation and mutual aid cease to exist among created things, the world of being would disintegrate utterly.","source":"'Abdu'l-Bahá","work":"Bahá'í Sacred Writings","tags":["unity","social","cooperation","global"]},{"id":89,"text":"Let the loved ones of God, whether young or old, whether male or female, each according to his capabilities, bestir themselves and spare no efforts to acquire the various current branches of knowledge, both spiritual and secular, and of the arts.","source":"'Abdu'l-Bahá","work":"Additional Tablets, Extracts and Talks","tags":["education","knowledge","equality","progress"]},{"id":90,"text":"In all matters moderation is desirable. If a thing is carried to excess, it will prove a source of evil.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["moderation","practical","conduct","character"]},{"id":91,"text":"Tread ye the path of justice, for this, verily, is the straight path. Compose your differences, and reduce your armaments, that the burden of your expenditures may be lightened.","source":"Bahá'u'lláh","work":"Gleanings","tags":["justice","peace","governance","practical"]},{"id":92,"text":"Be fair to yourselves and to others, that the evidences of justice may be revealed, through your deeds, among Our faithful servants.","source":"Bahá'u'lláh","work":"Gleanings","tags":["justice","character","practical","conduct"]},{"id":96,"text":"The supreme need of humanity is cooperation and reciprocity. The stronger the ties of fellowship and solidarity amongst men, the greater will be the power of constructiveness and accomplishment in all the planes of human activity.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["cooperation","social","unity","progress"]},{"id":97,"text":"When perfect equality shall be established between men and women, peace may be realized for the simple reason that womankind in general will never favor warfare.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["equality","women","peace","social"]},{"id":100,"text":"The happiness and greatness, the rank and station, the pleasure and peace of an individual have never consisted in his personal wealth, but rather in his excellent character, his high resolve, the breadth of his learning, and his ability to solve difficult problems.","source":"'Abdu'l-Bahá","work":"The Secret of Divine Civilisation","tags":["character","knowledge","progress","practical"]},{"id":101,"text":"When freedom of conscience, liberty of thought and right of speech prevail—that is to say, when every man according to his own idealization may give expression to his beliefs—development and growth are inevitable.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["governance","social","freedom","progress"]},{"id":102,"text":"True civilization will unfurl its banner in the midmost heart of the world whenever a certain number of its distinguished and high-minded sovereigns—the shining exemplars of devotion and determination—shall, for the good and happiness of all mankind, arise, with firm resolve and clear vision, to establish the Cause of Universal Peace.","source":"'Abdu'l-Bahá","work":"The Secret of Divine Civilisation","tags":["civilisation","governance","progress","social"]},{"id":104,"text":"The emancipation of women, the achievement of full equality between the sexes, is one of the most important, though less acknowledged, prerequisites of peace.","source":"Universal House of Justice","work":"The Promise of World Peace","tags":["equality","women","peace","social"]},{"id":107,"text":"The rich must give of their abundance; they must soften their hearts and cultivate a compassionate intelligence.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["economics","service","social","character"]},{"id":109,"text":"The gift of God to this enlightened age is the knowledge of the oneness of mankind and of the fundamental oneness of religion.","source":"'Abdu'l-Bahá","work":"'Abdu'l-Bahá in London","tags":["knowledge","unity","social","progress"]},{"id":111,"text":"Truth is one, although its manifestations may be very different.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["unity","truth","knowledge","social"]},{"id":112,"text":"The time has come when all mankind shall be united, when all races shall be loyal to one fatherland, all religions become one religion, and racial and religious bias pass away.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["unity","global","social","peace"]},{"id":114,"text":"Be ye a refuge to the fearful; bring ye rest and peace to the disturbed; make ye a provision for the destitute; be a treasury of riches for the poor; be a healing medicine for those who suffer pain.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["service","social","practical","action"]},{"id":115,"text":"Divine religion is not a cause for discord and disagreement. If religion becomes the source of antagonism and strife, the absence of religion is to be preferred.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["unity","social","reason","peace"]},{"id":121,"text":"Truthfulness is the foundation of all human virtues. Without truthfulness progress and success, in all the worlds of God, are impossible for any soul.","source":"'Abdu'l-Bahá","work":"Additional Tablets, Extracts and Talks","tags":["character","truth","practical","conduct"]},{"id":122,"text":"Beautify your tongues, O people, with truthfulness, and adorn your souls with the ornament of honesty. Beware, O people, that ye deal not treacherously with any one.","source":"Bahá'u'lláh","work":"Gleanings from the Writings of Bahá'u'lláh","tags":["character","truth","practical","conduct"]},{"id":123,"text":"Do not be content with showing friendship in words alone, let your heart burn with loving-kindness for all who may cross your path.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["character","love","practical","service"]},{"id":124,"text":"One must see in every human being only that which is worthy of praise. When this is done, one can be a friend to the whole human race.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["character","social","practical","unity"]},{"id":125,"text":"Bring thyself to account each day ere thou art summoned to a reckoning; for death, unheralded, shall come upon thee and thou shalt be called to give account for thy deeds.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["action","character","practical","conduct"]},{"id":129,"text":"Be anxiously concerned with the needs of the age ye live in, and centre your deliberations on its exigencies and requirements.","source":"Bahá'u'lláh","work":"Gleanings","tags":["social","action","practical","progress"]},{"id":130,"text":"No two men can be found who may be said to be outwardly and inwardly united. The evidences of discord and malice are apparent everywhere, though all were made for harmony and union.","source":"Bahá'u'lláh","work":"Gleanings","tags":["unity","social","practical","progress"]},{"id":132,"text":"Man must now become imbued with new virtues and powers, new moralities, new capacities. New bounties, bestowals and perfections are awaiting and already descending upon him.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["progress","social","action","civilisation"]},{"id":137,"text":"Be united in counsel, be one in thought. Let each morn be better than its eve and each morrow richer than its yesterday.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["consultation","progress","practical","action"]},{"id":138,"text":"The world is in great turmoil, and the minds of its people are in a state of utter confusion. We entreat the Almighty that He may graciously illuminate them with the glory of His Justice.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["justice","social","peace","governance"]},{"id":140,"text":"My first counsel is this: Possess a pure, kindly and radiant heart, that thine may be a sovereignty ancient, imperishable and everlasting.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["character","love","practical","conduct"]},{"id":149,"text":"Bend your minds and wills to the education of the peoples and kindreds of the earth, that haply the dissensions that divide it may, through the power of the Most Great Name, be blotted out from its face.","source":"Bahá'u'lláh","work":"Gleanings","tags":["education","unity","social","action"]},{"id":150,"text":"It is incumbent upon every man, in this Day, to hold fast unto whatsoever will promote the interests, and exalt the station, of all nations and just governments.","source":"Bahá'u'lláh","work":"Gleanings","tags":["governance","social","action","practical"]},{"id":151,"text":"God hath prescribed unto every one the duty of teaching His Cause. Whoever ariseth to discharge this duty, must needs, ere he proclaimeth His Message, adorn himself with the ornament of an upright and praiseworthy character.","source":"Bahá'u'lláh","work":"Gleanings","tags":["character","conduct","action","service"]},{"id":154,"text":"To give and to be generous are attributes of Mine; well is it with him that adorneth himself with My virtues.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["service","economics","action","practical"]},{"id":156,"text":"The fundamentals of the whole economic condition are divine in nature and are associated with the world of the heart and spirit.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["economics","social","justice"]},{"id":160,"text":"Humanity's crying need will not be met by a struggle among competing ambitions or by protest against one or another of the countless wrongs afflicting a desperate age.","source":"Universal House of Justice","work":"24 May 2001 message","tags":["social","action","service","progress"]},{"id":163,"text":"No man of wisdom can demonstrate his knowledge save by means of words. This showeth the significance of the Word as is affirmed in all the Scriptures, whether of former times or more recently.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["knowledge","communication","governance","science"]},{"id":165,"text":"A just king is the shadow of God on earth. All should seek shelter under the shadow of his justice.","source":"Bahá'u'lláh","work":"The Summons of the Lord of Hosts","tags":["justice","governance","social","practical"]},{"id":171,"text":"They must, when coming together, turn their faces to the Kingdom on high and ask aid from the Realm of Glory. They must then proceed with the utmost devotion, courtesy, dignity, care and moderation to express their views.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["consultation","governance","practical","prayer"]},{"id":172,"text":"Consort with the followers of all religions in a spirit of friendliness and fellowship.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["unity","service","love"]},{"id":174,"text":"The essence of wisdom is the fear of God, the dread of His scourge and punishment, and the apprehension of His justice and decree.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["justice","knowledge","character","practical"]},{"id":178,"text":"Act in accordance with the counsels of the Lord: that is, rise up in such wise, and with such qualities, as to endow the body of this world with a living soul, and to bring this young child, humanity, to the stage of adulthood.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["action","progress","social","service"]},{"id":179,"text":"The light of a good character surpasseth the light of the sun and the radiance thereof.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["character","conduct","practical","social"]},{"id":180,"text":"O My servant! Free thyself from the fetters of this world, and loose thy soul from the prison of self. Seize thy chance, for it will come to thee no more.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["detachment","soul","action"]},{"id":186,"text":"Sincerity is the foundation-stone of faith. That is, a religious individual must disregard his personal desires and seek in whatever way he can, wholeheartedly, to serve the public interest.","source":"'Abdu'l-Bahá","work":"The Secret of Divine Civilisation","tags":["character","service","practical","truth"]},{"id":194,"text":"Light is good in whatsoever lamp it is burning! A rose is beautiful in whatsoever garden it may bloom! A star has the same radiance if it shines from the East or from the West.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["prejudice","unity","social","diversity"]},{"id":197,"text":"O my God! O my God! Unite the hearts of Thy servants, and reveal to them Thy great purpose. May they follow Thy commandments and abide in Thy law. Help them, O God, in their endeavour, and grant them strength to serve Thee.","source":"Bahá'u'lláh","work":"Bahá'í Prayers","tags":["unity","social","action","service"]},{"id":200,"text":"The happiness of mankind will be realized when women and men coordinate and advance equally, for each is the complement and helpmeet of the other.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["equality","women","social","progress"]},{"id":203,"text":"O peoples of the world! Forsake all evil, hold fast that which is good. Strive to be shining examples unto all mankind, and true reminders of the virtues of God amidst men.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["character","conduct","action","social"]},{"id":204,"text":"The essence of all that We have revealed for thee is Justice, is for man to free himself from idle fancy and imitation, discern with the eye of oneness His glorious handiwork, and look into all things with a searching eye.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["justice","reason","knowledge","practical"]},{"id":207,"text":"Noble have I created thee, yet thou hast abased thyself. Rise then unto that for which thou wast created.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["action","character","practical","progress"]},{"id":208,"text":"Regard the world as the human body which, though at its creation whole and perfect, hath been afflicted, through various causes, with grave disorders and maladies.","source":"Bahá'u'lláh","work":"The Summons of the Lord of Hosts","tags":["social","governance","progress","practical"]},{"id":210,"text":"O peoples of the earth! Verily the resplendent Light of God hath appeared in your midst, invested with this unerring Book, that ye may be guided aright to the ways of peace and, by the leave of God, step out of the darkness into the light and onto this far-extended Path of Truth.","source":"The Báb","work":"Selections from the Writings of the Báb","tags":["knowledge","reason","progress"]},{"id":212,"text":"I bear witness, O my God, that Thou hast created me to know Thee and to worship Thee. I testify, at this moment, to my powerlessness and to Thy might, to my poverty and to Thy wealth. There is none other God but Thee, the Help in Peril, the Self-Subsisting.","source":"Bahá'u'lláh","work":"Bahá'í Prayers","tags":["prayer","knowledge","character"]},{"id":213,"text":"The most acceptable prayer is the one offered with the utmost spirituality and radiance; its prolongation hath not been and is not beloved by God. The more detached and the purer the prayer, the more acceptable is it in the presence of God.","source":"The Báb","work":"Selections from the Writings of the Báb","tags":["prayer","practical","character"]},{"id":214,"text":"The best beloved of all things in My sight is Justice; turn not away therefrom if thou desirest Me, and neglect it not that I may confide in thee.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["justice","reason","knowledge","practical"]},{"id":216,"text":"O contending peoples and kindreds of the earth! Set your faces towards unity, and let the radiance of its light shine upon you. Gather ye together, and for the sake of God resolve to root out whatever is the source of contention amongst you.","source":"Bahá'u'lláh","work":"Gleanings","tags":["unity","social","practical","peace"]},{"id":218,"text":"O ye that dwell on earth! The distinguishing feature that marketh the preeminent character of this Supreme Revelation consisteth in that We have, on the one hand, blotted out from the pages of God's holy Book whatsoever hath been the cause of strife, of malice and mischief amongst the children of men.","source":"Bahá'u'lláh","work":"Gleanings","tags":["unity","peace","social","progress"]},{"id":219,"text":"Every age hath its own problem, and every soul its particular aspiration. The remedy the world needeth in its present-day afflictions can never be the same as that which a subsequent age may require.","source":"Bahá'u'lláh","work":"Gleanings","tags":["progress","social","governance","practical"]},{"id":220,"text":"Beware lest the desires of the flesh and of a corrupt inclination provoke divisions among you. Be ye as the fingers of one hand, the members of one body.","source":"Bahá'u'lláh","work":"The Kitáb-i-Aqdas","tags":["unity","conduct","social","practical"]},{"id":221,"text":"They who are possessed of riches, however, must have the utmost regard for the poor, for great is the honor destined by God for those poor who are steadfast in patience.","source":"Bahá'u'lláh","work":"Gleanings from the Writings of Bahá'u'lláh","tags":["economics","poverty","justice","service"]},{"id":224,"text":"O people of God! I admonish you to observe courtesy, for above all else it is the prince of virtues. Well is it with him who is illumined with the light of courtesy and is attired with the vesture of uprightness.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["conduct","character","practical","social"]},{"id":225,"text":"Knowledge is one of the wondrous gifts of God. It is incumbent upon everyone to acquire it. Such arts and material means as are now manifest have been achieved by virtue of His knowledge and wisdom.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["knowledge","science","education","progress"]},{"id":226,"text":"Arts, crafts and sciences uplift the world of being, and are conducive to its exaltation. Knowledge is as wings to man's life, and a ladder for his ascent. Its acquisition is incumbent upon everyone.","source":"Bahá'u'lláh","work":"Epistle to the Son of the Wolf","tags":["knowledge","science","education","progress"]},{"id":227,"text":"We have permitted you to read such sciences as are profitable unto you, not such as end in idle disputation; better is this for you, if ye be of them that comprehend.","source":"Bahá'u'lláh","work":"The Kitáb-i-Aqdas","tags":["knowledge","science","education","reason"]},{"id":228,"text":"Honesty, virtue, wisdom and a saintly character redound to the exaltation of man, while dishonesty, imposture, ignorance and hypocrisy lead to his abasement.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["character","conduct","practical","truth"]},{"id":229,"text":"Should any one among you be incapable of grasping a certain truth, or be striving to comprehend it, show forth, when conversing with him, a spirit of extreme kindliness and good-will.","source":"Bahá'u'lláh","work":"Gleanings","tags":["conduct","character","practical","social"]},{"id":230,"text":"Ye are the stars of the heaven of understanding, the breeze that stirreth at the break of day, the soft-flowing waters upon which must depend the very life of all men.","source":"Bahá'u'lláh","work":"Gleanings","tags":["service","social","action","character"]},{"id":232,"text":"This is a new cycle of human power. All the horizons of the world are luminous, and the world will become indeed as a garden and a paradise. It is the hour of unity of the sons of men and of the drawing together of all races and all classes.","source":"'Abdu'l-Bahá","work":"'Abdu'l-Bahá in London","tags":["unity","progress","social","global"]},{"id":233,"text":"If we are true Bahá'ís speech is not needed. Our actions will help on the world, will spread civilization, will help the progress of science, and cause the arts to develop.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["action","science","progress","civilisation"]},{"id":236,"text":"Among the greatest of all services that can possibly be rendered by man to Almighty God is the education and training of children, young plants of the Abhá Paradise.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["education","family","service","progress"]},{"id":240,"text":"The body of the human world is sick. Its remedy and healing will be the oneness of the kingdom of humanity. Its life is the Most Great Peace. Its illumination and quickening is love.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["unity","peace","social","love"]},{"id":243,"text":"See ye no strangers; rather see all men as friends, for love and unity come hard when ye fix your gaze on otherness.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["unity","love","social","prejudice"]},{"id":244,"text":"To be a Bahá'í simply means to love all the world; to love humanity and try to serve it; to work for universal peace and universal brotherhood.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["love","service","unity","peace"]},{"id":246,"text":"The source of courage and power is the promotion of the Word of God, and steadfastness in His Love.","source":"'Abdu'l-Bahá","work":"Tablets of Bahá'u'lláh","tags":["justice","character","practical","social"]},{"id":247,"text":"Strive that your actions day by day may be beautiful prayers. Turn towards God, and seek always to do that which is right and noble.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["action","prayer","practical","character"]},{"id":254,"text":"Woman must endeavour then to attain greater perfection, to be man's equal in every respect, to make progress in all in which she has been backward, so that man will be compelled to acknowledge her equality of capacity and attainment.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["equality","women","progress","social"]},{"id":262,"text":"Is there any greater blessing conceivable for a man, than that he should become the cause of the education, the development, the prosperity and honour of his fellow-creatures?","source":"'Abdu'l-Bahá","work":"The Secret of Divine Civilisation","tags":["education","service","social","progress"]},{"id":264,"text":"O ye lovers of this wronged one! Cleanse ye your eyes, so that ye behold no man as different from yourselves. See ye no strangers; rather see all men as friends.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["unity","love","prejudice","social"]},{"id":271,"text":"Let your acts be a guide unto all mankind, for the professions of most men, be they high or low, differ from their conduct. It is through your deeds that ye can distinguish yourselves from others.","source":"'Abdu'l-Bahá","work":"Gleanings","tags":["conduct","action","character","practical"]},{"id":272,"text":"Man must walk in many paths and be subjected to various processes in his evolution upward.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["progress","knowledge","social","science"]},{"id":280,"text":"When the love of God is established, everything else will be realized.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["love","unity","practical","social"]},{"id":289,"text":"The Bahá'í Faith recognises the unity of God and of His Prophets, upholds the principle of an unfettered search after truth, condemns all forms of superstition and prejudice, teaches that the fundamental purpose of religion is to promote concord and harmony.","source":"Shoghi Effendi","work":"The Faith of Bahá'u'lláh","tags":["unity","reason","knowledge","social"]},{"id":291,"text":"The world is, in truth, moving on towards its destiny. The interdependence of the peoples and nations of the earth, whatever the leaders of the divisive forces of the world may say or do, is already an accomplished fact.","source":"Shoghi Effendi","work":"The Promised Day Is Come","tags":["global","unity","progress","social"]},{"id":299,"text":"Racism, one of the most baneful and persistent evils, is a major barrier to peace.","source":"Universal House of Justice","work":"The Promise of World Peace","tags":["prejudice","race","justice","social"]},{"id":305,"text":"The most vital duty, in this day, is to purify your characters, to correct your manners, and improve your conduct. The beloved of the Merciful must show forth such character and conduct among His creatures that the fragrance of their holiness may be shed upon the whole world.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["action","service","love","practical"]},{"id":308,"text":"O Son of Being! Love Me, that I may love thee. If thou lovest Me not, My love can in no wise reach thee. Know this, O servant.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["service","progress","action","social"]},{"id":311,"text":"The purpose of religion as revealed from the heaven of God's holy Will is to establish unity and concord amongst the peoples of the world; make it not the cause of dissension and strife.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["unity","social","peace","practical"]},{"id":312,"text":"We have, on the one hand, blotted out from the pages of God's holy Book whatsoever hath been the cause of strife, of malice and mischief amongst the children of men, and have, on the other, laid down the essential prerequisites of concord, of understanding, of complete and enduring unity.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["unity","peace","social","progress"]},{"id":316,"text":"We can well perceive how the whole human race is encompassed with great, with incalculable afflictions. We see it languishing on its bed of sickness, sore-tried and disillusioned. They that are intoxicated by self-conceit have interposed themselves between it and the Divine and infallible Physician.","source":"Bahá'u'lláh","work":"Gleanings","tags":["social","progress","governance","practical"]},{"id":317,"text":"The Great Being saith: O ye children of men! The fundamental purpose animating the Faith of God and His Religion is to safeguard the interests and promote the unity of the human race, and to foster the spirit of love and fellowship amongst men.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["unity","social","love","global"]},{"id":318,"text":"One of the signs of the maturity of the world is that no one will accept to bear the weight of kingship. Kingship will remain with none willing to bear alone its weight. That day will be the day whereon wisdom will be manifested among mankind.","source":"Bahá'u'lláh","work":"The Kitáb-i-Aqdas","tags":["governance","global","progress","social"]},{"id":320,"text":"In the estimation of the people of Bahá man's glory lieth in his knowledge, his upright conduct, his praiseworthy character, his wisdom, and not in his nationality or rank.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["knowledge","character","practical","progress"]},{"id":321,"text":"Say: O people of God! That which can ensure the victory of Him Who is the Eternal Truth, His hosts and helpers on earth, have been set down in the sacred Books and Scriptures, and are as clear and manifest as the sun. These hosts are such righteous deeds, such conduct and character, as are acceptable in His sight.","source":"Bahá'u'lláh","work":"Gleanings from the Writings of Bahá'u'lláh","tags":["knowledge","action","practical","character"]},{"id":322,"text":"Take heed lest excessive reading and too many acts of piety in the daytime and in the night season make you vainglorious. Should a person recite but a single verse from the Holy Writings in a spirit of joy and radiance, this would be better for him than reciting wearily all the Scriptures of God, the Help in Peril, the Self-Subsisting.","source":"Bahá'u'lláh","work":"The Kitáb-i-Aqdas","tags":["action","service","practical","social"]},{"id":323,"text":"Among the things which are conducive to unity and concord and will cause the whole earth to be regarded as one country is that the divers languages be reduced to one language and in like manner the scripts used in the world be confined to a single script.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["unity","global","language","progress"]},{"id":324,"text":"Every word that proceedeth out of the mouth of God is endowed with such potency as can instil new life into every human frame, if ye be of them that comprehend this truth.","source":"Bahá'u'lláh","work":"Gleanings","tags":["knowledge","practical","character","progress"]},{"id":325,"text":"O Son of Being! Walk in My statutes for love of Me, and deny thyself that which thou desirest if thou seekest My pleasure.","source":"Bahá'u'lláh","work":"The Hidden Words","tags":["service","action","character","conduct"]},{"id":326,"text":"The essence of charity is for the servant to recount the blessings of his Lord, and to render thanks unto Him at all times and under all conditions.","source":"Bahá'u'lláh","work":"Tablets of Bahá'u'lláh","tags":["gratitude","character","practical","conduct"]},{"id":327,"text":"Hold ye fast unto refinement under all conditions, that your eyes may be preserved from beholding what is repugnant both to your own selves and to the dwellers of Paradise.","source":"Bahá'u'lláh","work":"The Kitáb-i-Aqdas","tags":["character","conduct","practical","social"]},{"id":328,"text":"He Who is your Lord, the All-Merciful, cherisheth in His heart the desire of beholding the entire human race as one soul and one body. Haste ye to win your share of God's good grace and mercy in this Day.","source":"Bahá'u'lláh","work":"Gleanings","tags":["unity","love","social","global"]},{"id":332,"text":"And among the teachings of Bahá'u'lláh is that religious, racial, political, economic and patriotic prejudices destroy the edifice of humanity. As long as these prejudices prevail, the world of humanity will not have rest.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["prejudice","unity","social","progress"]},{"id":333,"text":"Science may be likened to a mirror wherein the images of the mysteries of outer phenomena are reflected.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["science","knowledge","reason","progress"]},{"id":340,"text":"The happiness of man is in the fragrance of the love of God.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["love","social","character","practical"]},{"id":342,"text":"Justice is not limited; it is a universal quality. Its operation must be carried out in all classes, from the highest to the lowest. Justice must be sacred, and the rights of all the people must be considered.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["justice","social","equality","governance"]},{"id":343,"text":"All the divisions in the world, hatred, war and bloodshed, are caused by one or other of these prejudices.","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["prejudice","unity","love","social"]},{"id":349,"text":"Sciences of former ages and philosophies of the past are useless today. Present exigencies demand new methods of solution.","source":"'Abdu'l-Bahá","work":"The Promulgation of Universal Peace","tags":["science","progress","reason","knowledge"]},{"id":360,"text":"Let your ambition be the achievement on earth of a heavenly civilization!","source":"'Abdu'l-Bahá","work":"Paris Talks","tags":["civilisation","governance","conduct","social"]},{"id":362,"text":"For the tongue is a smoldering fire, and excess of speech a deadly poison. Material fire consumeth the body, whereas the fire of the tongue devoureth both heart and soul. The force of the former lasteth but for a time, whilst the effects of the latter endure a century.","source":"'Abdu'l-Bahá","work":"The Kitáb-i-Íqán","tags":["communication","conduct","character","practical"]},{"id":363,"text":"In every dispensation, there hath been the commandment of fellowship and love, but it was a commandment limited to the community of those in mutual agreement, not to the dissident foe. In this wondrous age, however, praised be God, the commandments of God are not delimited, not restricted to any one group of people, rather have all the friends been commanded to show forth fellowship and love, consideration and generosity and loving-kindness to every community on earth.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["love","unity","social","progress"]},{"id":364,"text":"Whensoever ye behold a person whose entire attention is directed toward the Cause of God; whose only aim is this, to make the Word of God to take effect; who, day and night, with pure intent, is rendering service to the Cause; from whose behavior not the slightest trace of egotism or private motives is discerned—who, rather, wandereth distracted in the wilderness of the love of God, and drinketh only from the cup of the knowledge of God, and is utterly engrossed in spreading the sweet savors of God, and is enamored of the holy verses of the Kingdom of God—know ye for a certainty that this individual will be supported and reinforced by heaven; that like unto the morning star, he will forever gleam brightly out of the skies of eternal grace.","source":"'Abdu'l-Bahá","work":"Selections from the Writings of 'Abdu'l-Bahá","tags":["action","service","social","progress"]},{"id":380,"text":"Verily I say, this is the Day in which mankind can behold the Face, and hear the Voice, of the Promised One. The Call of God hath been raised, and the light of His countenance hath been lifted up upon men. It behoveth every man to blot out the trace of every idle word from the tablet of his heart.","source":"Bahá'u'lláh","work":"Gleanings from the Writings of Bahá'u'lláh","tags":["conduct","character","progress","practical"]},{"id":382,"text":"The principle of the Oneness of Mankind—the pivot round which all the teachings of Bahá'u'lláh revolve—is no mere outburst of ignorant emotionalism or an expression of vague and pious hope. Its appeal is not to be merely identified with a reawakening of the spirit of brotherhood and good-will among men.","source":"Shoghi Effendi","work":"The World Order of Bahá'u'lláh","tags":["unity","social","global","progress"]},{"id":385,"text":"It is towards this goal—the goal of a new World Order, Divine in origin, all-embracing in scope, equitable in principle, challenging in its features—that a harassed humanity must strive.","source":"Shoghi Effendi","work":"The World Order of Bahá'u'lláh","tags":["governance","global","unity","progress"]},{"id":389,"text":"It calls for no less than the reconstruction and the demilitarization of the whole civilized world—a world organically unified in all the essential aspects of its life, its political machinery, its spiritual aspiration, its trade and finance, its script and language, and yet infinite in the diversity of the national characteristics of its federated units.","source":"Shoghi Effendi","work":"The World Order of Bahá'u'lláh","tags":["unity","peace","global","governance"]},{"id":404,"text":"Viewed in such a light, consultation is the operating expression of justice in human affairs.","source":"Bahá'í International Community","work":"The Prosperity of Humankind","tags":["consultation","justice","governance","practical"]}];

// ── BAHÁ'Í CALENDAR ────────────────────────────────────────────────────────
// Bahá'í month names (19 months of 19 days + Ayyám-i-Há)
var BAHAI_MONTHS = [
  "Bahá","Jalál","Jamál","ʻAẓamat","Núr","Raḥmat",
  "Kalimát","Kamál","Asmáʼ","ʻIzzat",
  "Mashíyyat","ʻIlm","Qudrat","Qawl","Masáʼil",
  "Sharaf","Sulṭán","Mulk","Alá"
];
// Naw-Rúz (Bahá'í New Year) falls on 20 March in most years
// Ayyám-i-Há begins after day 19 of Mulk (month 18), before Alá (month 19)
// Mulk day 19 = Gregorian 28 Feb (or 29 Feb in leap year) at noon for simplicity
// We work purely with Gregorian dates for the conversion

// Bahá'í year 1 = 1844 CE. Naw-Rúz = 20 March each year (post-2015 exact astronomical,
// but 20 March is correct for nearly all years and sufficient for display purposes).
// Each Bahá'í day begins at sunset.

// Given a JS Date object, return {month, day, year, isAyyam}
// month = 1-19, day = 1-19, isAyyam = bool (during Ayyám-i-Há)
function toBahaiDate(jsDate) {
  // Work in local date
  var y = jsDate.getFullYear();
  var mo = jsDate.getMonth() + 1; // 1-12
  var d = jsDate.getDate();

  // Naw-Rúz for this Gregorian year is 20 March
  // Bahá'í year = Gregorian year - 1843 (if on/after Naw-Rúz), else - 1844
  var nawRuzMonth = 3, nawRuzDay = 20;

  // Is current date before or after Naw-Rúz?
  var afterNawRuz = (mo > nawRuzMonth) || (mo === nawRuzMonth && d >= nawRuzDay);
  var bahaiYear = afterNawRuz ? (y - 1843) : (y - 1844);

  // Day of Bahá'í year (1 = Naw-Rúz = 20 March)
  // Build a simple day-of-year offset from Naw-Rúz
  // Days in each month for day-of-year calculation
  function isLeap(yr) { return (yr%4===0 && yr%100!==0) || yr%400===0; }
  var daysInMonth = [0,31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31];

  // Day of year for current date (1 = Jan 1)
  var doy = 0;
  for (var i=1;i<mo;i++) doy += daysInMonth[i];
  doy += d;

  // Day of year for Naw-Rúz (20 March)
  var nawRuzDoy = 31 + daysInMonth[2] + 20; // Jan + Feb + 20

  var bahaiDoy; // day within Bahá'í year, 1-indexed from Naw-Rúz
  if (afterNawRuz) {
    bahaiDoy = doy - nawRuzDoy + 1;
  } else {
    // Before Naw-Rúz: count from Naw-Rúz of previous year
    var prevYear = y - 1;
    var daysInPrevFeb = isLeap(prevYear) ? 29 : 28;
    var prevNawRuzDoy = 31 + daysInPrevFeb + 20;
    var prevYearDays = isLeap(prevYear) ? 366 : 365;
    // Days from Naw-Rúz of prev year to end of prev year
    var daysAfterPrevNawRuz = prevYearDays - prevNawRuzDoy + 1;
    bahaiDoy = daysAfterPrevNawRuz + doy;
  }

  // Bahá'í year has 365 (or 366) days: 19*19 = 361 + 4 (or 5) Ayyám-i-Há days
  // Months 1-18 = days 1-342, Ayyám-i-Há = days 343-346 (347 in leap), month 19 = remaining 19 days
  var leapBahai = isLeap(afterNawRuz ? y : y-1); // leap year of the Gregorian year containing Naw-Rúz
  // Actually Ayyám-i-Há length = 4 normally, 5 in leap year preceding Naw-Rúz
  // The leap that matters is the Gregorian year in which Naw-Rúz falls (i.e. current if after NR, prev if before)
  var nawRuzYear = afterNawRuz ? y : y - 1;
  // Ayyám-i-Há has 5 days if the NEXT Gregorian year is a leap year (the year after Naw-Rúz)
  var ayyamLength = isLeap(nawRuzYear + 1) ? 5 : 4;

  if (bahaiDoy <= 342) {
    var month = Math.ceil(bahaiDoy / 19);
    var day = bahaiDoy - (month - 1) * 19;
    return {year: bahaiYear, month: month, day: day, isAyyam: false, ayyamDay: 0};
  } else if (bahaiDoy <= 342 + ayyamLength) {
    return {year: bahaiYear, month: 0, day: 0, isAyyam: true, ayyamDay: bahaiDoy - 342};
  } else {
    var day19 = bahaiDoy - 342 - ayyamLength;
    return {year: bahaiYear, month: 19, day: day19, isAyyam: false, ayyamDay: 0};
  }
}

function formatBahaiDate(bd) {
  if (bd.isAyyam) {
    return "Ayyám-i-Há " + bd.ayyamDay;
  }
  return BAHAI_MONTHS[bd.month - 1] + " " + bd.day;
}

// ── SUNSET CALCULATION ─────────────────────────────────────────────────────
// Standard NOAA/Almanac formula, accurate to ~1-2 minutes
function calcSunset(lat, lng, date) {
  var rad = Math.PI / 180;
  var JD = (date.getTime() / 86400000) + 2440587.5;
  var n = Math.floor(JD - 2451545.0 + 0.5);
  var Lsun = (280.46 + 0.9856474 * n) % 360;
  var Msun = (357.528 + 0.9856003 * n) % 360;
  var lambda = Lsun + 1.915 * Math.sin(Msun * rad) + 0.020 * Math.sin(2 * Msun * rad);
  var sinDec = Math.sin(23.439 * rad) * Math.sin(lambda * rad);
  var cosDec = Math.cos(Math.asin(sinDec));
  // Hour angle for sunset (zenith = 90.833 including refraction and solar disc)
  var cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
  if (cosH < -1) return null; // midnight sun
  if (cosH > 1) return null;  // polar night
  var H = Math.acos(cosH) / rad; // degrees
  // Sunset time in UTC hours
  var utcSunset = 12 + H/15 - lng/15;
  // Adjust for equation of time
  utcSunset = utcSunset % 24;
  return utcSunset; // hours in UTC
}

// ── STATE ──────────────────────────────────────────────────────────────────
var state = {favourites:[], removed:[], moreLike:[], queue:[], qIdx:0, lat:null, lng:null};
var currentId = null;
var sessionHistory = [];

function saveState(){try{localStorage.setItem('bahai_v3',JSON.stringify(state));}catch(e){}}
function loadState(){
  try{
    var s=localStorage.getItem('bahai_v3');
    if(s){var p=JSON.parse(s);
      state.favourites=p.favourites||[];
      state.removed=p.removed||[];
      state.moreLike=p.moreLike||[];
      state.lat=p.lat||null;
      state.lng=p.lng||null;
    }
  }catch(e){}
}

// ── DATE/TIME HEADER ───────────────────────────────────────────────────────
function updateHeader(sunsetUTC) {
  var now = new Date();
  var h = now.getHours();
  var utcH = now.getUTCHours() + now.getUTCMinutes()/60;

  // Is it after sunset?
  var afterSunset = false;
  if (sunsetUTC !== null && sunsetUTC !== undefined) {
    afterSunset = utcH >= sunsetUTC;
  } else {
    // Fallback: sunset at 18:00 local
    afterSunset = h >= 18;
  }

  // Period label
  var period;
  if (h >= 5 && h < 12) period = "Morning";
  else if (h >= 12 && !afterSunset) period = "Afternoon";
  else period = "Evening";

  // Gregorian date (no year, no weekday): "16 June"
  var gregOpts = {day:"numeric", month:"long"};
  var gregStr = now.toLocaleDateString("en-GB", gregOpts);

  // Bahá'í date: if after sunset, use tomorrow's Gregorian date for the conversion
  var bahaiBase = new Date(now);
  if (afterSunset) {
    bahaiBase.setDate(bahaiBase.getDate() + 1);
  }
  var bd = toBahaiDate(bahaiBase);
  var bahaiStr = formatBahaiDate(bd);

  document.getElementById("d-greg").textContent = gregStr;
  document.getElementById("d-period").textContent = period;
  document.getElementById("d-bahai").textContent = bahaiStr;
  document.getElementById("d-sr").textContent = gregStr + ", " + period + ", " + bahaiStr;
}

function getSunsetAndUpdate() {
  // If we have stored coords and today's sunset, use them
  var today = new Date().toDateString();
  try {
    var stored = JSON.parse(localStorage.getItem("bahai_sun")||"{}");
    if (stored.date === today && stored.sunset !== undefined && stored.lat) {
      state.lat = stored.lat;
      state.lng = stored.lng;
      updateHeader(stored.sunset);
      return;
    }
  } catch(e) {}

  // If we have coords from state, recalculate for today
  if (state.lat !== null && state.lng !== null) {
    var sunset = calcSunset(state.lat, state.lng, new Date());
    try { localStorage.setItem("bahai_sun", JSON.stringify({date:today, sunset:sunset, lat:state.lat, lng:state.lng})); } catch(e){}
    updateHeader(sunset);
    return;
  }

  // No coords yet — try geolocation
  updateHeader(null); // show with fallback first
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        state.lat = pos.coords.latitude;
        state.lng = pos.coords.longitude;
        saveState();
        var sunset = calcSunset(state.lat, state.lng, new Date());
        try { localStorage.setItem("bahai_sun", JSON.stringify({date:today, sunset:sunset, lat:state.lat, lng:state.lng})); } catch(e){}
        updateHeader(sunset);
      },
      function() {
        // Permission denied or unavailable — keep fallback
        updateHeader(null);
      },
      {timeout:8000, maximumAge:86400000}
    );
  }
}

// ── PASSAGE ENGINE ─────────────────────────────────────────────────────────
function buildQueue(){
  var avail=PASSAGES.filter(function(p){return state.removed.indexOf(p.id)===-1;});
  if(!avail.length) return PASSAGES.map(function(p){return p.id;});
  // Don't re-serve passages already seen this session (e.g. after "More like this"
  // or hide/restore rebuilds the queue). If everything has been seen, fall back to
  // the full available list so Next keeps working.
  var unseen=avail.filter(function(p){return sessionHistory.indexOf(p.id)===-1;});
  if(unseen.length) avail=unseen;
  var tagScore={};
  state.moreLike.forEach(function(id){
    var p=PASSAGES.filter(function(x){return x.id===id;})[0];
    if(p) p.tags.forEach(function(t){tagScore[t]=(tagScore[t]||0)+2;});
  });
  var scored=avail.map(function(p){
    var sc=1;
    p.tags.forEach(function(t){if(tagScore[t]) sc+=tagScore[t];});
    return {id:p.id,sc:sc};
  });
  var result=[],pool=scored.slice();
  while(pool.length){
    var tot=0;
    pool.forEach(function(x){tot+=x.sc;});
    var r=Math.random()*tot;
    for(var i=0;i<pool.length;i++){r-=pool[i].sc;if(r<=0){result.push(pool[i].id);pool.splice(i,1);break;}}
  }
  return result;
}

function showPassage(id){
  currentId=id;
  // Push to session history if it's a new forward navigation
  if(sessionHistory.length === 0 || sessionHistory[sessionHistory.length-1] !== id){
    sessionHistory.push(id);
  }
  updatePrevBtn();
  var p=PASSAGES.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  document.getElementById("ptxt").textContent=p.text;
  document.getElementById("psrc").innerHTML="— "+p.source+", <em>"+p.work+"</em>";
  var bf=document.getElementById("btn-fav");
  var bm=document.getElementById("btn-more");
  if(state.favourites.indexOf(id)!==-1){bf.classList.add("fav-on");bf.querySelector("svg").setAttribute("fill","currentColor");}
  else{bf.classList.remove("fav-on");bf.querySelector("svg").setAttribute("fill","none");}
  if(state.moreLike.indexOf(id)!==-1) bm.classList.add("more-on");
  else bm.classList.remove("more-on");
}

function nextPassage(){
  if(!state.queue.length){state.queue=buildQueue();state.qIdx=0;}
  var tries=0;
  while(tries<state.queue.length){
    var id=state.queue[state.qIdx%state.queue.length];
    state.qIdx++;
    if(state.removed.indexOf(id)===-1){showPassage(id);saveState();return;}
    tries++;
  }
  showPassage(PASSAGES[0].id);
}

function prevPassage(){
  if(sessionHistory.length < 2) return;
  // Remove current from history
  sessionHistory.pop();
  // Skip back over any passages the user has hidden
  while(sessionHistory.length > 0 && state.removed.indexOf(sessionHistory[sessionHistory.length-1]) !== -1){
    sessionHistory.pop();
  }
  if(sessionHistory.length === 0){ updatePrevBtn(); return; }
  // Get the previous
  var id = sessionHistory[sessionHistory.length-1];
  currentId = id;
  var p = PASSAGES.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  document.getElementById("ptxt").textContent = p.text;
  document.getElementById("psrc").innerHTML = "— "+p.source+", <em>"+p.work+"</em>";
  var bf = document.getElementById("btn-fav");
  var bm = document.getElementById("btn-more");
